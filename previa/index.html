03c/p>", "Resposta": "\u003cp>Aplicar o critério explícito, como menor operação ou menor custo.\u003c/p>", "Comentarios": "\u003cp>Não trocar o critério pedido por uma preferência pessoal de tecnologia.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Well-Architected Framework - AWS Well-Architected Framework\u003c/a>\u003cbr>\u003csmall>SAA-26-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-008-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Qual finalidade do AWS Well-Architected Tool?\u003c/p>", "Resposta": "\u003cp>Apoiar revisões de workloads e identificar riscos conforme boas práticas.\u003c/p>", "Comentarios": "\u003cp>A ferramenta não redesenha automaticamente a aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/userguide/tool.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Well-Architected Tool? - AWS Well-Architected\u003c/a>\u003cbr>\u003csmall>SAA-26-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-008-C002", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Uma revisão arquitetural deve ser executada apenas antes da primeira implantação?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Mudanças de requisitos e uso podem criar novos riscos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/userguide/tool.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Well-Architected Tool? - AWS Well-Architected\u003c/a>\u003cbr>\u003csmall>SAA-26-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-009-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Qual ideia central de infraestrutura imutável?\u003c/p>", "Resposta": "\u003cp>Substituir componentes por versões definidas, em vez de acumular mudanças manuais neles.\u003c/p>", "Comentarios": "\u003cp>Ajuda a reduzir diferenças difíceis de reproduzir.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_tracking_change_management_immutable_infrastructure.html\" target=\"_blank\" rel=\"noopener noreferrer\">REL08-BP04 Deploy using immutable infrastructure - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-009-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-009-C002", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Por que mudanças manuais não registradas dificultam recuperação?\u003c/p>", "Resposta": "\u003cp>O ambiente real pode divergir do que os templates recriam.\u003c/p>", "Comentarios": "\u003cp>Rastrear e versionar configuração reduz essa lacuna.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_tracking_change_management_immutable_infrastructure.html\" target=\"_blank\" rel=\"noopener noreferrer\">REL08-BP04 Deploy using immutable infrastructure - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-010-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Por que monitorar quotas antes de aumentar tráfego?\u003c/p>", "Resposta": "\u003cp>O limite pode bloquear expansão mesmo quando a arquitetura suporta scaling.\u003c/p>", "Comentarios": "\u003cp>Solicitar ajuste durante uma emergência pode ser tarde.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/manage-service-quotas-and-constraints.html\" target=\"_blank\" rel=\"noopener noreferrer\">Manage service quotas and constraints - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-010-C002", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Quotas devem ser consideradas apenas na conta principal e região ativa?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Contas e regiões de contingência também precisam estar preparadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/manage-service-quotas-and-constraints.html\" target=\"_blank\" rel=\"noopener noreferrer\">Manage service quotas and constraints - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-001-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Um e-commerce tem picos sazonais e servidores web intercambiáveis. Como expandir a camada web mantendo tolerância à falha zonal?\u003c/p>", "Resposta": "\u003cp>Usar balanceamento e Auto Scaling distribuído entre AZs.\u003c/p>", "Comentarios": "\u003cp>Sessões e arquivos precisam sobreviver à substituição dos servidores.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html\" target=\"_blank\" rel=\"noopener noreferrer\">Auto Scaling benefits for application architecture - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-27-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-001-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>No e-commerce, catálogo gera muitas leituras tolerantes a atraso, mas compras exigem escrita. Qual melhoria direcionada considerar?\u003c/p>", "Resposta": "\u003cp>Separar leituras adequadas para réplicas ou cache, mantendo escritas no destino correto.\u003c/p>", "Comentarios": "\u003cp>Não enviar transações críticas indiscriminadamente a réplicas assíncronas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with DB instance read replicas - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-27-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-002-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Um site estático deve ser público, mas o bucket não pode aceitar leitura direta anônima. Qual combinação atende?\u003c/p>", "Resposta": "\u003cp>CloudFront com origem S3 privada, OAC e política restrita.\u003c/p>", "Comentarios": "\u003cp>A entrada pública fica na distribuição autorizada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restrict access to an Amazon S3 origin - Amazon CloudFront\u003c/a>\u003cbr>\u003csmall>SAA-27-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-002-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma nova versão do site foi enviada, mas usuários recebem o JavaScript antigo. Qual camada investigar?\u003c/p>", "Resposta": "\u003cp>O cache da distribuição e dos clientes.\u003c/p>", "Comentarios": "\u003cp>Nomes versionados ou invalidação podem fazer parte da publicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Invalidation.html\" target=\"_blank\" rel=\"noopener noreferrer\">Invalidate files to remove content - Amazon CloudFront\u003c/a>\u003cbr>\u003csmall>SAA-27-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-003-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uploads de imagens chegam em rajadas e podem ser processados depois. Como desacoplar recepção e processamento?\u003c/p>", "Resposta": "\u003cp>Armazenar no S3 e encaminhar eventos a um fluxo com fila e consumidores adequados.\u003c/p>", "Comentarios": "\u003cp>A fila absorve variações sem exigir que o upload espere o processamento inteiro.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon S3 Event Notifications - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-27-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-003-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma função gera thumbnails no mesmo bucket que dispara sua execução. Qual cuidado evita recursão?\u003c/p>", "Resposta": "\u003cp>Separar prefixos ou buckets e aplicar filtros de evento.\u003c/p>", "Comentarios": "\u003cp>O resultado não deve reativar indefinidamente o mesmo processamento.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html\" target=\"_blank\" rel=\"noopener noreferrer\">Process Amazon S3 event notifications with Lambda - AWS Lambda\u003c/a>\u003cbr>\u003csmall>SAA-27-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-004-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma API de clientes precisa de login e autorização por usuário. Uma API key basta?\u003c/p>", "Resposta": "\u003cp>Não. Usar mecanismo de autenticação e autorização apropriado.\u003c/p>", "Comentarios": "\u003cp>API key identifica uso em certos recursos, mas não substitui identidade segura.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-control-access-to-api.html\" target=\"_blank\" rel=\"noopener noreferrer\">Control and manage access to REST APIs in API Gateway - Amazon API Gateway\u003c/a>\u003cbr>\u003csmall>SAA-27-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-004-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma API pode sobrecarregar um backend limitado. Qual controle de entrada ajuda?\u003c/p>", "Resposta": "\u003cp>Throttling, junto de dimensionamento e tratamento de limite no cliente.\u003c/p>", "Comentarios": "\u003cp>A elasticidade da camada de entrada não aumenta sozinha a capacidade do backend.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html\" target=\"_blank\" rel=\"noopener noreferrer\">Throttle requests to your REST APIs for better throughput in API Gateway - Amazon API Gateway\u003c/a>\u003cbr>\u003csmall>SAA-27-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-005-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma aplicação Linux em várias EC2 exige arquivos NFS compartilhados. Qual opção gerenciada atende ao padrão?\u003c/p>", "Resposta": "\u003cp>Amazon EFS.\u003c/p>", "Comentarios": "\u003cp>S3 exigiria adaptar a interface se a aplicação espera filesystem NFS.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Elastic File System? - Amazon Elastic File System\u003c/a>\u003cbr>\u003csmall>SAA-27-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-005-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Por que não anexar qualquer volume EBS a todos os servidores para substituir NFS?\u003c/p>", "Resposta": "\u003cp>Multi-Attach tem restrições e exige coordenação do filesystem/aplicação.\u003c/p>", "Comentarios": "\u003cp>Bloco compartilhado não é automaticamente um serviço de arquivos compartilhado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html\" target=\"_blank\" rel=\"noopener noreferrer\">Attach an EBS volume to multiple EC2 instances using Multi-Attach - Amazon EBS\u003c/a>\u003cbr>\u003csmall>SAA-27-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-006-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma aplicação Windows depende de SMB e permissões integradas ao AD. Qual serviço de arquivos considerar?\u003c/p>", "Resposta": "\u003cp>FSx for Windows File Server.\u003c/p>", "Comentarios": "\u003cp>A compatibilidade de protocolo é a restrição decisiva.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is FSx for Windows File Server? - Amazon FSx for Windows File Server\u003c/a>\u003cbr>\u003csmall>SAA-27-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-006-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma empresa quer integrar aplicações ao diretório corporativo existente. O que deve orientar a escolha de Directory Service?\u003c/p>", "Resposta": "\u003cp>Necessidade de diretório gerenciado ou de conexão ao diretório existente.\u003c/p>", "Comentarios": "\u003cp>Managed Microsoft AD e AD Connector não têm o mesmo papel.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/what_is.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Directory Service? - AWS Directory Service\u003c/a>\u003cbr>\u003csmall>SAA-27-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-007-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Telemetria precisa de múltiplos consumidores e replay recente. Qual modelo de ingestão avaliar?\u003c/p>", "Resposta": "\u003cp>Um stream retido, como Kinesis Data Streams.\u003c/p>", "Comentarios": "\u003cp>Uma única fila competitiva não entrega automaticamente todo histórico a cada consumidor.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Kinesis Data Streams Terminology and concepts - Amazon Kinesis Data Streams\u003c/a>\u003cbr>\u003csmall>SAA-27-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-007-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>O requisito é entregar eventos a S3 com mínimo gerenciamento de consumidores. Qual serviço considerar?\u003c/p>", "Resposta": "\u003cp>Amazon Data Firehose.\u003c/p>", "Comentarios": "\u003cp>Avaliar buffering e transformação exigidos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Data Firehose? - Amazon Data Firehose\u003c/a>\u003cbr>\u003csmall>SAA-27-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-008-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Várias equipes compartilham dados analíticos, mas devem ter acessos distintos. Qual capacidade precisa existir no data lake?\u003c/p>", "Resposta": "\u003cp>Governança granular e coerente de acesso aos dados.\u003c/p>", "Comentarios": "\u003cp>Lake Formation pode participar desse controle nas integrações suportadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Lake Formation? - AWS Lake Formation\u003c/a>\u00  tipos e lógica podem exigir conversão.\u003c/p>", "Comentarios": "\u003cp>Testar consultas e aplicações além dos dados transferidos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html\" target=\"_blank\" rel=\"noopener noreferrer\">Converting database schemas using DMS Schema Conversion - AWS Database Migration Service\u003c/a>\u003cbr>\u003csmall>SAA-27-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-010-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma aplicação transacional exige recuperação regional. Qual aspecto dos dados precisa ser definido antes do failover?\u003c/p>", "Resposta": "\u003cp>O RPO e o comportamento da replicação no momento da mudança.\u003c/p>", "Comentarios": "\u003cp>Uma região secundária existente não garante ausência de perda.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using switchover or failover in Amazon Aurora Global Database - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-27-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-010-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>O ambiente secundário tem dados replicados, mas quota insuficiente para escalar. Qual requisito de DR foi negligenciado?\u003c/p>", "Resposta": "\u003cp>Capacidade operacional de recuperação.\u003c/p>", "Comentarios": "\u003cp>Preparar dados e preparar capacidade são etapas complementares.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\ enários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Documentos retidos raramente são lidos, mas precisam estar disponíveis imediatamente quando solicitados. Deep Archive é automaticamente adequado?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A classe precisa atender ao tempo de acesso; considerar opções de recuperação imediata.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/glacier-storage-classes.html\" target=\"_blank\" rel=\"noopener noreferrer\">Understanding S3 Glacier storage classes for long-term data storage - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-27-014-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-015-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Dezenas de VPCs precisam de conectividade central com segmentação. Qual serviço avaliar?\u003c/p>", "Resposta": "\u003cp>Transit Gateway com route tables planejadas.\u003c/p>", "Comentarios": "\u003cp>Conectar todas as redes sem segmentação não atende automaticamente ao requisito.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Transit Gateway for Amazon VPC? - Amazon VPC\u003c/a>\u003cbr>\u003csmall>SAA-27-015-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-015-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Um parceiro só precisa consumir uma API privada, sem acesso amplo à rede. Qual padrão considerar?\u003c/p>", "Resposta": "\u003cp>Exposição de serviço via PrivateLink em arquitetura compatível.\u003c/p>", "Comentarios": "\u003cp>Acesso a serviço pode ser preferível a interligar toda a rede.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS PrivateLink? - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-27-015-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-016-C001", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma proposta corta metade da capacidade sem testar o pico e viola a latência exigida. Ela é uma otimização válida?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A economia deve preservar o requisito do workload.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/select-the-correct-resource-type-size-and-number.html\" target=\"_blank\" rel=\"noopener noreferrer\">Select the correct resource type, size, and number - Cost Optimization Pillar\u003c/a>\u003cbr>\u003csmall>SAA-27-016-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-27-016-C002", "modulo": "27", "assunto": "Cenários integrados de arquitetura", "campos": {"Pergunta": "\u003cp>Uma empresa tem uso estável após eliminar desperdício. Qual próxima alavanca financeira avaliar?\u003c/p>", "Resposta": "\u003cp>Compromissos de uso compatíveis, como Savings Plans ou reservas apropriadas.\u003c/p>", "Comentarios": "\u003cp>Não contratar acima da base de uso justificada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Cenários integrados de arquitetura", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html\" target=\"_blank\" rel=\"noopener noreferrer\">What are Savings Plans? - Savings Plans\u003c/a>\u003cbr>\u003csmall>SAA-27-016-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-001-C001", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Num diagrama web, o banco aceita tráfego da internet inteira. Que melhoria de segurança priorizar?\u003c/p>", "Resposta": "\u003cp>Restringir acesso ao caminho e aos clientes necessários, normalmente pela camada de aplicação.\u003c/p>", "Comentarios": "\u003cp>O protocolo de banco não precisa ser público só porque a aplicação web é pública.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-example-private-subnets-nat.html\" target=\"_blank\" rel=\"noopener noreferrer\">Example: VPC with servers in private subnets and NAT - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-28-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-002-C001", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Uma requisição falha antes de abrir conexão HTTP porque o nome não resolve. Qual etapa do caminho investigar?\u003c/p>", "Resposta": "\u003cp>Resolução DNS.\u003c/p>", "Comentarios": "\u003cp>Balanceador e banco não corrigem um nome que não é resolvido pelo cliente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/Welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Route 53? - Amazon Route 53\u003c/a>\u003cbr>\u003csmall>SAA-28-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-002-C002", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>DNS resolve e TLS termina no ALB, mas o backend retorna erro. Qual evidência ajuda a separar rede e aplicação?\u003c/p>", "Resposta": "\u003cp>Logs, health checks e resposta do target.\u003c/p>", "Comentarios": "\u003cp>Seguir o caminho por etapas evita mudar controles sem diagnóstico.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-troubleshooting.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot your Application Load Balancers - Elastic Load Balancing\u003c/a>\u003cbr>\u003csmall>SAA-28-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-003-C001", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Ao simular a perda de uma AZ, quais componentes além das instâncias devem entrar na análise?\u003c/p>", "Resposta": "\u003cp>Dados, saída de rede, balanceamento e dependências compartilhadas.\u003c/p>", "Comentarios": "\u003cp>A réplica da camada web não prova resiliência do restante.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html\" target=\"_blank\" rel=\"noopener noreferrer\">Auto Scaling benefits for application architecture - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-28-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-004-C001", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Após um pico, CPU está normal, mas latência de banco e conexões aumentaram. Onde concentrar investigação?\u003c/p>", "Resposta": "\u003cp>No banco e na forma de acesso a ele.\u003c/p>", "Comentarios": "\u003cp>A métrica da camada web não representa todo o sistema.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Metrics concepts - Amazon CloudWatch\u003c/a>\u003cbr>\u003csmall>SAA-28-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-004-C002", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>O backlog sobe e a idade das mensagens cresce. Qual requisito de negócio pode estar sendo violado?\u003c/p>", "Resposta": "\u003cp>O prazo aceitável para concluir o processamento.\u003c/p>", "Comentarios": "\u003cp>Fila evita perda imediata, mas não garante conclusão dentro do prazo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html\" target=\"_blank\" rel=\"noopener noreferrer\">Scaling policy based on Amazon SQS - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-28-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-005-C001", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Qual evidência de revisão ajuda a localizar dados expostos por uma política de recurso?\u003c/p>", "Resposta": "\u003cp>Achados de acesso externo e inspeção das concessões efetivas.\u003c/p>", "Comentarios": "\u003cp>Validar a intenção do compartilhamento antes de classificar o risco.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-28-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-006-C001", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Qual resultado de laboratório demonstra melhor recuperação do que apenas backup verde?\u003c/p>", "Resposta": "\u003cp>Restaurar, verificar dados e executar uma transação funcional.\u003c/p>", "Comentarios": "\u003cp>Medir os tempos relaciona o teste ao RTO.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/restore-testing.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restore testing - AWS Backup\u003c/a>\u003cbr>\u003csmall>SAA-28-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-006-C002", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>O teste restaurou dados de ontem, mas o negócio aceita perder apenas minutos. Qual objetivo não foi comprovado?\u003c/p>", "Resposta": "\u003cp>O RPO.\u003c/p>", "Comentarios": "\u003cp>Uma restauração tecnicamente bem-sucedida pode não atender ao negócio.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restoring a DB instance to a specified time for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-28-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-007-C001", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Um lote com um item inválido repete itens já processados. Qual comportamento de integração avaliar?\u003c/p>", "Resposta": "\u003cp>Resposta parcial de lote e idempotência dos itens.\u003c/p>", "Comentarios": "\u003cp>A solução deve evitar tanto duplicação de efeitos quanto perda de trabalho.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html\" target=\"_blank\" rel=\"noopener noreferrer\">Handling errors for an SQS event source in Lambda - AWS Lambda\u003c/a>\u003cbr>\u003csmall>SAA-28-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-007-C002", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Qual evidência registrar ao mover uma mensagem problemática para DLQ?\u003c/p>", "Resposta": "\u003cp>Identificador, erro e contexto suficiente para investigar e recuperar.\u003c/p>", "Comentarios": "\u003cp>Não expor segredos desnecessariamente nos logs.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using dead-letter queues in Amazon SQS - Amazon Simple Queue Service\u003c/a>\u003cbr>\u003csmall>SAA-28-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-008-C001", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Após adicionar mais NATs, quais dimensões comparar além da nova cobrança por recurso?\u003c/p>", "Resposta": "\u003cp>Processamento, tráfego entre AZs e requisito de disponibilidade.\u003c/p>", "Comentarios": "\u003cp>Uma mudança pode aumentar uma parcela e reduzir outra.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">Analyzing your costs and usage with AWS Cost Explorer - AWS Cost Management\u003c/a>\u003cbr>\u003csmall>SAA-28-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-28-008-C002", "modulo": "28", "assunto": "Prática integrada: observar, diagnosticar e explicar", "campos": {"Pergunta": "\u003cp>Uma alteração reduz custo por pedido, mas a fatura total cresce porque o volume dobrou. Ela necessariamente piorou eficiência?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Comparar custo unitário e atendimento dos requisitos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Prática integrada: observar, diagnosticar e explicar", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Cost Optimization Pillar - AWS Well-Architected Framework - Cost Optimization Pillar\u003c/a>\u003cbr>\u003csmall>SAA-28-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-29-001-C001", "modulo": "29", "assunto": "Questões autorais e caderno de erros", "campos": {"Pergunta": "\u003cp>Escolha uma: EC2 precisa ler S3 sem credenciais permanentes.\u003c/p>\u003cp>A) Chaves root na AMI.\u003c/p>\u003cp>B) Role associada à instância.\u003c/p>\u003cp>C) Bucket público.\u003c/p>", "Resposta": "\u003cp>B) Role associada à instância.\u003c/p>", "Comentarios": "\u003cp>A expõe credenciais privilegiadas; C altera a exposição dos dados sem necessidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Questões autorais e caderno de erros", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp.html\" target=\"_blank\" rel=\"noopener noreferrer\">Temporary security credentials in IAM - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-29-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-29-001-C002", "modulo": "29", "assunto": "Questões autorais e caderno de erros", "campos": {"Pergunta": "\u003cp>Escolha uma: prestador multicliente assume role; deve-se mitigar confused deputy.\u003c/p>\u003cp>A) External ID na trust policy.\u003c/p>\u003cp>B) Abrir o bucket.\u003c/p>\u003cp>C) Aumentar timeout.\u003c/p>", "Resposta": "\u003cp>A) External ID na trust policy.\u003c/p>", "Comentarios": "\u003cp>O controle vincula a assunção ao contexto esperado; as outras opções não resolvem a delegação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Questões autorais e caderno de erros", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html\" target=\"_blank\" rel=\"noopener noreferrer\">Access to AWS accounts owned by third parties - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-29-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-29-002-C001", "modulo": "29", "assunto": "Questões autorais e caderno de erros", "campos": {"Pergunta": "\u003cp>Escolha uma: credenciais de banco precisam de ciclo de rotação gerenciado.\u003c/p>\u003cp>A) Texto na imagem.\u003c/p>\u003cp>B) Secrets Manager com rotação adequada.\u003c/p>\u003cp>C) Tag no recurso.\u003c/p>", "Resposta": "\u003cp>B) Secrets Manager com rotação adequada.\u003c/p>", "Comentarios": "\u003cp>A rotação precisa atualizar o sistema de destino e o segredo de forma coordenada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Questões autorais e caderno de erros", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html\" target=\"_blank\" rel=\"noopener noreferrer\">Rotate AWS Secrets Manager secrets - AWS Secrets Manager\u003c/a>\u003cbr>\u003csmall>SAA-29-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-29-002-C002", "modulo": "29", "assunto": "Questões autorais e caderno de erros", "campos": {"Pergunta": "\u003cp>Escolha uma: retenção não pode ser encurtada nem por root durante o prazo.\u003c/p>\u003cp>A) Só versioning.\u003c/p>\u003cp>B) Object Lock compliance.\u003c/p>\u003cp>C) Presigned URL.\u003c/p>", "Resposta": "\u003cp>B) Object Lock compliance.\u003c/p>", "Comentarios": "\u003cp>Versioning sozinho não impede exclusão autorizada de versões; URL assinada trata acesso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Questões autorais e caderno de erros", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Locking objects with Object Lock - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-29-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-29-003-C001", "modulo": "29", "assunto": "Questões autorais e caderno de erros", "campos": {"Pergunta": "\u003cp>Escolha uma: RDS DB instance precisa de failover automático, sem objetivo de leitura adicional.\u003c/p>\u003cp>A) Multi-AZ com standby.\u003c/p>\u003cp>B) Só aumentar disco.\u003c/p>\u003cp>C) Só cache local.\u003c/p>", "Resposta": "\u003cp>A) Multi-AZ com standby.\u003c/p>", "Comentarios": "\u003cp>As demais opções não criam a proteção de disponibilidade pedida.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Questões autorais e caderno de erros", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-AZ DB instance deployments for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-29-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-29-003-C002", "modulo": "29", "assunto": "Questões autorais e caderno de erros", "campos": {"Pergunta": "\u003cp>Escolha uma: qual evidência sustenta melhor o RTO?\u003c/p>\u003cp>A) Backup existe.\u003c/p>\u003cp>B) Restauração funcional cronometrada.\u003c/p>\u003cp>C) Volume está cifrado.\u003c/p>", "Resposta": "\u003cp>B) Restauração funcional cronometrada.\u003c/p>", "Comentarios": "\u003cp>Preservação e criptografia são importantes, mas não medem o tempo de retorno do serviço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Questões autorais e caderno de erros", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/restore-testing.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restore testing - AWS Backup\u003c/a>\u003cbr>\u003csmall>SAA-29-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-29-004-C001", "modulo": "29", "assunto": "Questões autorais e caderno de erros", "campos": {"Pergunta": "\u003cp>Escolha uma: dois serviços precisam receber cada evento e ter backlog independente.\u003c/p>\u003cp>A) Ambos competem na mesma fila.\u003c/p>\u003cp>B) SNS para duas filas.\u003c/p>\u003cp>C) Um arquivo local.\u003c/p>", "Resposta": "\u003cp>B) SNS para duas filas.\u003c/p>", "Comentarios": "\u003cp>A competição numa única fila não oferece uma cópia de cada mensagem a cada aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Questões autorais e caderno de erros", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html\" target=\"_blank\" rel=\"noopener noreferrer\">Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing - Amazon Simple Notification Service\u003c/a>\u003cbr>\u003csmall>SAA-29-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-29-004-C002", "modulo": "29", "assunto": "Questões autorais e caderno de erros", "campos": {"Pergunta": "\u003cp>Escolha uma: trabalho ainda executa quando a mensagem fica STS no contexto AWS?\u003c/p>", "Resposta": "\u003cp>Security Token Service.\u003c/p>", "Comentarios": "\u003cp>É associado à emissão de credenciais temporárias, não a armazenamento de segredos de aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp.html\" target=\"_blank\" rel=\"noopener noreferrer\">Temporary security credentials in IAM - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-30-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-002-C001", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>O que significa VPC?\u003c/p>", "Resposta": "\u003cp>Virtual Private Cloud.\u003c/p>", "Comentarios": "\u003cp>É a rede virtual onde se configuram subnets, rotas e outros recursos compatíveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon VPC? - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-30-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-002-C002", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>O que o prefixo /24 representa na notação CIDR IPv4?\u003c/p>", "Resposta": "\u003cp>Que 24 bits compõem o prefixo de rede.\u003c/p>", "Comentarios": "\u003cp>O tamanho do prefixo determina a faixa de endereços; disponibilidade para recursos inclui reservas do provedor.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html\" target=\"_blank\" rel=\"noopener noreferrer\">VPC CIDR blocks - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-30-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-003-C001", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>Na expressão RPO, point se refere ao tempo para ligar servidores?\u003c/p>", "Resposta": "\u003cp>Não. Refere-se ao ponto recuperável dos dados.\u003c/p>", "Comentarios": "\u003cp>Associar RPO à perda de dados e RTO ao tempo de retorno do serviço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://aws.amazon.com/what-is/recovery-time-objective/\" target=\"_blank\" rel=\"noopener noreferrer\">What is Recovery Time Objective (RTO)? - RTO Explained - AWS\u003c/a>\u003cbr>\u003csmall>SAA-30-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-004-C001", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>Leitura eventualmente consistente significa que cada leitura sempre verá o dado mais recente?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O sistema pode convergir para o estado mais recente sem garantir sua visibilidade imediata em toda leitura.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html\" target=\"_blank\" rel=\"noopener noreferrer\">DynamoDB read consistency - Amazon DynamoDB\u003c/a>\u003cbr>\u003csmall>SAA-30-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-004-C002", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>O que significa replication lag?\u003c/p>", "Resposta": "\u003cp>O atraso entre alterações da origem e sua aplicação ou visibilidade na réplica.\u003c/p>", "Comentarios": "\u003cp>A interpretação exata da métrica depende do produto.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with DB instance read replicas - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-30-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-005-C001", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>O que significa IOPS?\u003c/p>", "Resposta": "\u003cp>Input/output operations per second, operações de entrada e saída por segundo.\u003c/p>", "Comentarios": "\u003cp>Não expressa sozinho quantos bytes cada operação transfere.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EBS volume types - Amazon EBS\u003c/a>\u003cbr>\u003csmall>SAA-30-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-005-C002", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>Partition key e shard são sinônimos em um stream?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A chave participa da distribuição lógica; shard é uma unidade de particionamento/capacidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Kinesis Data Streams Terminology and concepts - Amazon Kinesis Data Streams\u003c/a>\u003cbr>\u003csmall>SAA-30-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-006-C001", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>O que significa least operational overhead em um enunciado?\u003c/p>", "Resposta": "\u003cp>Menor esforço operacional entre soluções que atendem aos requisitos.\u003c/p>", "Comentarios": "\u003cp>Não significa obrigatoriamente menor preço de infraestrutura.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Well-Architected Framework - AWS Well-Architected Framework\u003c/a>\u003cbr>\u003csmall>SAA-30-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-006-C002", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>O que significa most cost-effective em um enunciado?\u003c/p>", "Resposta": "\u003cp>A alternativa com melhor custo para atender às condições exigidas.\u003c/p>", "Comentarios": "\u003cp>Não escolher a opção mais barata que descumpre segurança ou disponibilidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Glossário aplicado e leitura técnica", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Well-Architected Framework - AWS Well-Architected Framework\u003c/a>\u003cbr>\u003csmall>SAA-30-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-30-007-C001", "modulo": "30", "assunto": "Glossário aplicado e leitura técnica", "campos": {"Pergunta": "\u003cp>Durable e highly available descrevem a mesma propriedade?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Durabilidade preserva os dados; disponibilidade trata de acesso e funcionamento quando necessário.\u003c/p>", "Logo": "", "Materia": "AWS · SAA- 'use strict';
const data=JSON.parse(document.getElementById('payload').textContent),all=data.cards;
const subject=document.getElementById('subject'),search=document.getElementById('search'),viewer=document.getElementById('viewer'),counter=document.getElementById('counter'),reveal=document.getElementById('reveal'),prev=document.getElementById('prev'),next=document.getElementById('next');
let filtered=all,index=0,back=false,light=false;
for(const [id,name] of new Map(all.map(c=>[c.modulo,c.assunto]))){const opt=document.createElement('option');opt.value=id;opt.textContent=id+' · '+name;subject.append(opt)}
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function renderTemplate(t,f){const sections=/\{\{([#^])(\w+)\}\}([\s\S]*?)\{\{\/\2\}\}/g;let old;do{old=t;t=t.replace(sections,(_,op,key,body)=>((op==='#')===Boolean(f[key]))?body:'')}while(old!==t);return t.replace(/\{\{(\w+)\}\}/g,(_,key)=>f[key]||'')}
function render(){const empty=filtered.length===0;prev.disabled=empty||index===0;next.disabled=empty||index===filtered.length-1;reveal.disabled=empty;document.getElementById('empty').hidden=!empty;viewer.hidden=empty;if(empty){viewer.innerHTML='';counter.textContent='0 cartões';return}const c=filtered[index];viewer.innerHTML=renderTemplate(back?data.back:data.front,c.campos);viewer.querySelector('.sm-card').classList.toggle('sm-light',light);counter.textContent=(index+1)+' de '+filtered.length+' · '+c.id;reveal.textContent=back?'Voltar à pergunta':'Mostrar resposta'}
function filter(){const q=norm(search.value);filtered=all.filter(c=>(!subject.value||c.modulo===subject.value)&&norm(c.campos.Pergunta).includes(q));index=0;back=false;render()}
subject.addEventListener('change',filter);search.addEventListener('input',filter);
reveal.addEventListener('click',()=>{back=!back;render()});prev.addEventListener('click',()=>{if(index>0){index--;back=false;render()}});next.addEventListener('click',()=>{if(index<filtered.length-1){index++;back=false;render()}});
document.getElementById('theme').addEventListener('click',e=>{light=!light;e.target.textContent=light?'Tema escuro':'Tema claro';e.target.setAttribute('aria-pressed',String(light));render()});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','SUMMARY','A'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click();if(e.code==='Space'){e.preventDefault();reveal.click()}});render();
</script></body></html>
