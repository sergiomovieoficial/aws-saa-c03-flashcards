WS Shield network security director\u003c/a>\u003cbr>\u003csmall>SAA-02-018-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-018-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Um security group inspeciona parâmetros HTTP para detectar SQL injection?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Regras de portas e origens não substituem inspeção de aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html\" target=\"_blank\" rel=\"noopener noreferrer\">What are AWS WAF, AWS Shield Advanced, AWS Shield network security director and AWS Firewall Manager? - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director\u003c/a>\u003cbr>\u003csmall>SAA-02-018-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-019-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual serviço analisa sinais AWS para detectar atividade suspeita e ameaças?\u003c/p>", "Resposta": "\u003cp>Amazon GuardDuty.\u003c/p>", "Comentarios": "\u003cp>Detecção produz achados; a resposta pode exigir integração e automação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon GuardDuty? - Amazon GuardDuty\u003c/a>\u003cbr>\u003csmall>SAA-02-019-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-019-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual serviço avalia vulnerabilidades de workloads suportados, como instâncias e imagens de containers?\u003c/p>", "Resposta": "\u003cp>Amazon Inspector.\u003c/p>", "Comentarios": "\u003cp>O foco é diferente de procurar dados pessoais em objetos S3.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Inspector? - Amazon Inspector\u003c/a>\u003cbr>\u003csmall>SAA-02-019-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-019-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual serviço ajuda a descobrir dados sensíveis no S3?\u003c/p>", "Resposta": "\u003cp>Amazon Macie.\u003c/p>", "Comentarios": "\u003cp>A classificação de dados complementa controles de acesso e criptografia.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Macie? - Amazon Macie\u003c/a>\u003cbr>\u003csmall>SAA-02-019-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-020-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual serviço consolida achados de segurança e avalia postura em integrações suportadas?\u003c/p>", "Resposta": "\u003cp>AWS Security Hub.\u003c/p>", "Comentarios": "\u003cp>Consolidação não torna desnecessários os serviços que produzem os achados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html\" target=\"_blank\" rel=\"noopener noreferrer\">Introduction to AWS Security Hub CSPM - AWS Security Hub\u003c/a>\u003cbr>\u003csmall>SAA-02-020-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-020-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual serviço ajuda a investigar e relacionar eventos de segurança após um achado?\u003c/p>", "Resposta": "\u003cp>Amazon Detective.\u003c/p>", "Comentarios": "\u003cp>Ele auxilia a análise; não é um substituto de firewall.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/detective/latest/userguide/what-is-detective.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Detective? - Amazon Detective\u003c/a>\u003cbr>\u003csmall>SAA-02-020-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-020-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Onde obter relatórios de conformidade e determinados acordos da AWS?\u003c/p>", "Resposta": "\u003cp>AWS Artifact.\u003c/p>", "Comentarios": "\u003cp>Relatórios da infraestrutura AWS não certificam automaticamente a configuração do cliente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Artifact? - AWS Artifact\u003c/a>\u003cbr>\u003csmall>SAA-02-020-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-021-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual serviço oferece firewall gerenciado para inspeção de tráfego em arquiteturas VPC?\u003c/p>", "Resposta": "\u003cp>AWS Network Firewall.\u003c/p>", "Comentarios": "\u003cp>O caminho de roteamento precisa passar pelos endpoints de inspeção.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Network Firewall? - AWS Network Firewall\u003c/a>\u003cbr>\u003csmall>SAA-02-021-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-021-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual serviço administra políticas de proteção de forma centralizada em múltiplas contas?\u003c/p>", "Resposta": "\u003cp>AWS Firewall Manager.\u003c/p>", "Comentarios": "\u003cp>Ele coordena políticas de recursos suportados; não substitui cada mecanismo de proteção.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Firewall Manager - AWS WAF, AWS Firewall Manager, AWS Shield Advanced, and AWS Shield network security director\u003c/a>\u003cbr>\u003csmall>SAA-02-021-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-001-C001", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma API retorna AccessDenied. Qual contexto verificar antes de ampliar permissões?\u003c/p>", "Resposta": "\u003cp>O principal efetivo, a ação, o recurso e as políticas aplicáveis.\u003c/p>", "Comentarios": "\u003cp>A aplicação pode estar usando uma role diferente daquela imaginada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot access denied error messages - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-001-C002", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma policy permite acesso, mas há Deny explícito por condição satisfeita. Qual correção conceitual é necessária?\u003c/p>", "Resposta": "\u003cp>Corrigir a condição ou o bloqueio conforme a intenção de segurança.\u003c/p>", "Comentarios": "\u003cp>Adicionar outro Allow não supera a negação explícita.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot access denied error messages - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-002-C001", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma EC2 usa uma role com GetObject, mas o SDK utiliza chaves fixas configuradas no ambiente. Qual identidade pode estar fazendo a chamada?\u003c/p>", "Resposta": "\u003cp>A identidade das chaves fixas, conforme a cadeia de obtenção de credenciais.\u003c/p>", "Comentarios": "\u003cp>A mera associação da role não apaga credenciais configuradas pela aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM roles for Amazon EC2 - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-03-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-002-C002", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Por que testar leitura de um objeto não comprova permissão de listar o bucket?\u003c/p>", "Resposta": "\u003cp>Ler objeto e listar bucket são operações e recursos de autorização diferentes.\u003c/p>", "Comentarios": "\u003cp>Separar s3:GetObject de s3:ListBucket ao diagnosticar.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM roles for Amazon EC2 - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-03-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-003-C001", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>A origem tem sts:AssumeRole, mas a role de destino não confia nela. O que revisar?\u003c/p>", "Resposta": "\u003cp>A trust policy do destino.\u003c/p>", "Comentarios": "\u003cp>A permissão na origem não estabelece a confiança na outra conta.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM tutorial: Delegate access across AWS accounts using IAM roles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-003-C002", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>AssumeRole funciona, mas GetObject falha após a troca. Qual etapa passou e qual ainda precisa de revisão?\u003c/p>", "Resposta": "\u003cp>A assunção passou; o acesso ao recurso da sessão precisa ser revisado.\u003c/p>", "Comentarios": "\u003cp>Não confundir autorização para assumir a role com autorização para todas as ações.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM tutorial: Delegate access across AWS accounts using IAM roles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-004-C001", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Um administrador de conta membro é impedido por SCP de executar uma ação. Anexar outra política administrativa resolve?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>É necessário revisar o guardrail organizacional com a autoridade adequada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html\" target=\"_blank\" rel=\"noopener noreferrer\">Service control policies (SCPs) - AWS Organizations\u003c/a>\u003cbr>\u003csmall>SAA-03-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-004-C002", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma SCP com Allow concede acesso a uma role sem política de permissão?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>SCPs limitam o conjunto de permissões possíveis; não são a concessão de acesso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html\" target=\"_blank\" rel=\"noopener noreferrer\">Service control policies (SCPs) - AWS Organizations\u003c/a>\u003cbr>\u003csmall>SAA-03-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-005-C001", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma policy depende de tag de recurso e só alguns recursos falham. O que comparar?\u003c/p>", "Resposta": "\u003cp>As tags e os valores efetivamente usados na condição.\u003c/p>", "Comentarios": "\u003cp>A mesma ação pode ter decisões diferentes conforme os atributos do recurso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_condition.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM JSON policy elements: Condition - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-005-C002", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma chamada automatizada falha sob uma condição MFA. Por que não basta verificar apenas a senha do usuário?\u003c/p>", "Resposta": "\u003cp>A avaliação usa o contexto da requisição e das credenciais.\u003c/p>", "Comentarios": "\u003cp>A condição precisa ser adequada ao tipo de sessão que a aplicação utiliza.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_condition.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM JSON policy elements: Condition - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-006-C001", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma aplicação lê chaves AWS de um arquivo na EC2. Qual migração reduz gestão de segredos estáticos?\u003c/p>", "Resposta": "\u003cp>Associar uma role apropriada e usar o provedor de credenciais do SDK.\u003c/p>", "Comentarios": "\u003cp>Remover as chaves antigas do código e revogar credenciais desnecessárias faz parte da migração.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html\" target=\"_blank\" rel=\"noopener noreferrer\">Security best practices in IAM - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-006-C002", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Por que copiar credenciais temporárias manualmente para um arquivo não é uma solução duradoura?\u003c/p>", "Resposta": "\u003cp>Elas expiram e precisam de renovação.\u003c/p>", "Comentarios": "\u003cp>Usar o mecanismo de obtenção e renovação apropriado ao ambiente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html\" target=\"_blank\" rel=\"noopener noreferrer\">Security best practices in IAM - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-007-C001", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Um achado de acesso externo significa necessariamente invasão ocorrida?\u003c/p>", "Resposta": "\u003cp>Não. Pode indicar uma possibilidade de acesso configurada.\u003c/p>", "Comentarios": "\u003cp>Investigar intenção, principal e recurso antes de concluir que houve uso indevido.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-007-C002", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Como distinguir compartilhamento intencional de exposição indesejada em uma policy?\u003c/p>", "Resposta": "\u003cp>Comparar o principal autorizado e as condições com a zona de confiança esperada.\u003c/p>", "Comentarios": "\u003cp>Uma conta externa legítima pode ser permitida de forma controlada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-008-C001", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Um teste permite ler o objeto correto, mas também permite excluir qualquer objeto. O menor privilégio foi demonstrado?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>É preciso verificar ações permitidas e ações que devem continuar negadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_testing-policies.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM policy testing with the IAM policy simulator - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-03-008-C002", "modulo": "03", "assunto": "IAM: cenários de laboratório e diagnóstico", "campos": {"Pergunta": "\u003cp>Por que validar uma policy com testes positivos e negativos?\u003c/p>", "Resposta": "\u003cp>Para comprovar que ela permite o necessário e restringe o restante esperado.\u003c/p>", "Comentarios": "\u003cp>Uma única chamada bem-sucedida não prova o isolamento completo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM: cenários de laboratório e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_testing-policies.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM policy testing with the IAM policy simulator - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-03-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-001-C001", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Uma aplicação mantém um grande conjunto de dados em memória. Qual perfil EC2 avaliar primeiro?\u003c/p>", "Resposta": "\u003cp>Instâncias otimizadas para memória.\u003c/p>", "Comentarios": "\u003cp>A escolha final depende das métricas reais, não apenas do nome da aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2 instance types - Amazon EC2\u003c/a>\u003cbr>\u003csmall>SAA-04-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-001-C002", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Um processamento é limitado por cálculos de CPU. Qual perfil EC2 avaliar?\u003c/p>", "Resposta": "\u003cp>Instâncias otimizadas para computação.\u003c/p>", "Comentarios": "\u003cp>Adicionar memória sem resolver o gargalo de CPU pode não melhorar o resultado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2 instance types - Amazon EC2\u003c/a>\u003cbr>\u003csmall>SAA-04-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-002-C001", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Qual é a função de uma AMI?\u003c/p>", "Resposta": "\u003cp>Fornecer a imagem necessária para iniciar uma instância EC2.\u003c/p>", "Comentarios": "\u003cp>A imagem inclui o software base; permissões e rede ainda precisam ser configuradas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Machine Images in Amazon EC2 - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-04-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-002-C002", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Para que serve user data em uma instância EC2?\u003c/p>", "Resposta": "\u003cp>Executar configuração de inicialização conforme o sistema e o mecanismo utilizados.\u003c/p>", "Comentarios": "\u003cp>Não é um cofre de segredos e não substitui uma estratégia de configuração segura.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/user-data.html\" target=\"_blank\" rel=\"noopener noreferrer\">Run commands when you launch an EC2 instance with user data input - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-04-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-002-C003", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Por que usar um launch template em um Auto Scaling group?\u003c/p>", "Resposta": "\u003cp>Para definir de forma reutilizável como novas instâncias serão lançadas.\u003c/p>", "Comentarios": "\u003cp>Inclui opções como AMI, tipo de instância e configuração de rede.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-launch-templates.html\" target=\"_blank\" rel=\"noopener noreferrer\">Store instance launch parameters in Amazon EC2 launch templates - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-04-002-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-003-C001", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Parar uma instância EC2 elimina todos os custos associados a ela?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Volumes EBS e outros recursos mantidos podem continuar gerando cobrança.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2 instance state changes - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-04-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-003-C002", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Reboot normalmente apaga os dados do instance store?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A perda está associada a eventos como stop, hibernate, terminate ou falha do host, não ao reboot normal.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2 instance state changes - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-04-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-003-C003", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Qual é a finalidade de hibernar uma instância compatível?\u003c/p>", "Resposta": "\u003cp>Preservar o estado da memória para retomar a execução.\u003c/p>", "Comentarios": "\u003cp>É necessário atender aos requisitos de suporte e armazenamento.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-lifecycle.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2 instance state changes - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-04-003-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-04-004-C001", "modulo": "04", "assunto": "Computação EC2 e modelos de compra", "campos": {"Pergunta": "\u003cp>Que tipo de dado combina com instance store?\u003c/p>", "Resposta": "\u003cp>Dados temporários ou reconstruíveis.\u003c/p>", "Comentarios": "\u003cp>Não depender dele como única cópia de informação durável.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Computação EC2 e modelos de compra", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html\" target=\"_blank\" rel=\"noopener noreferrer\">Instance store temporary block storage for EC2 instances - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-04-004-C001 · Refer caling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html\" target=\"_blank\" rel=\"noopener noreferrer\">Scheduled scaling for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-05-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-008-C002", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Qual mecanismo usa histórico de carga para antecipar necessidades recorrentes?\u003c/p>", "Resposta": "\u003cp>Predictive scaling.\u003c/p>", "Comentarios": "\u003cp>Previsão deve ser avaliada junto a estratégias reativas e ao padrão real de demanda.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html\" target=\"_blank\" rel=\"noopener noreferrer\">Predictive scaling for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-05-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-009-C001", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Para que serve instance warmup no Auto Scaling?\u003c/p>", "Resposta": "\u003cp>Representar o tempo necessário para novas instâncias atingirem funcionamento normal.\u003c/p>", "Comentarios": "\u003cp>Evita tratar imediatamente toda capacidade recém-iniciada como estabilizada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-default-instance-warmup.html\" target=\"_blank\" rel=\"noopener noreferrer\">Set the default instance warmup for an Auto Scaling group - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-05-009-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-009-C002", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Por que tempo de boot não deve ser ignorado ao dimensionar uma aplicação elástica?\u003c/p>", "Resposta": "\u003cp>A capacidade recém-lançada pode demorar a atender requisições.\u003c/p>", "Comentarios": "\u003cp>Picos mais rápidos que o provisionamento exigem planejamento adicional.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-default-instance-warmup.html\" target=\"_blank\" rel=\"noopener noreferrer\">Set the default instance warmup for an Auto Scaling group - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-05-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-010-C001", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Qual recurso permite executar tarefas antes de concluir lançamento ou término de uma instância do grupo?\u003c/p>", "Resposta": "\u003cp>Lifecycle hooks.\u003c/p>", "Comentarios": "\u003cp>A automação precisa concluir ou administrar o timeout da ação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2 Auto Scaling lifecycle hooks - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-05-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-010-C002", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Por que usar deregistration delay ao retirar um target?\u003c/p>", "Resposta": "\u003cp>Para dar oportunidade de concluir requisições em andamento.\u003c/p>", "Comentarios": "\u003cp>Isso não preserva trabalho indefinidamente nem substitui tratamento de falhas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html\" target=\"_blank\" rel=\"noopener noreferrer\">Edit target group attributes for your Application Load Balancer - Elastic Load Balancing\u003c/a>\u003cbr>\u003csmall>SAA-05-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-011-C001", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Por que distribuir um Auto Scaling group entre AZs?\u003c/p>", "Resposta": "\u003cp>Para reduzir impacto de falhas localizadas e distribuir capacidade.\u003c/p>", "Comentarios": "\u003cp>As demais dependências da aplicação também precisam de redundância.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html\" target=\"_blank\" rel=\"noopener noreferrer\">Auto Scaling benefits for application architecture - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-05-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-011-C002", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Ter instâncias em duas AZs basta se todas dependem de um banco sem proteção contra falha zonal?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A disponibilidade da arquitetura é limitada pelas dependências críticas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html\" target=\"_blank\" rel=\"noopener noreferrer\">Auto Scaling benefits for application architecture - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-05-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-012-C001", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Qual é o objetivo de sticky sessions?\u003c/p>", "Resposta": "\u003cp>Encaminhar requisições de uma sessão ao mesmo target durante a afinidade aplicável.\u003c/p>", "Comentarios": "\u003cp>Isso pode ajudar aplicações com estado, mas não torna o estado local durável.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html#sticky-sessions\" target=\"_blank\" rel=\"noopener noreferrer\">Edit target group attributes for your Application Load Balancer - Elastic Load Balancing\u003c/a>\u003cbr>\u003csmall>SAA-05-012-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-012-C002", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Por que externalizar sessões costuma facilitar substituição de instâncias?\u003c/p>", "Resposta": "\u003cp>A sessão deixa de depender da memória de um target específico.\u003c/p>", "Comentarios": "\u003cp>O armazenamento externo precisa atender latência e disponibilidade exigidas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html#sticky-sessions\" target=\"_blank\" rel=\"noopener noreferrer\">Edit target group attributes for your Application Load Balancer - Elastic Load Balancing\u003c/a>\u003cbr>\u0 ing\u003c/a>\u003cbr>\u003csmall>SAA-05-015-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-015-C002", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Por que o total de mensagens sozinho pode ser um sinal incompleto para scaling?\u003c/p>", "Resposta": "\u003cp>Ele não considera quantidade e velocidade dos consumidores.\u003c/p>", "Comentarios": "\u003cp>O tempo aceitável na fila também importa.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html\" target=\"_blank\" rel=\"noopener noreferrer\">Scaling policy based on Amazon SQS - Amazon EC2 Auto Scaling\u003c/a>\u003cbr>\u003csmall>SAA-05-015-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-016-C001", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Uma aplicação grava uploads no disco local de cada servidor. Qual barreira isso cria para scaling?\u003c/p>", "Resposta": "\u003cp>Outros servidores podem não acessar os mesmos arquivos.\u003c/p>", "Comentarios": "\u003cp>Usar armazenamento apropriado compartilhado ou de objetos conforme o padrão de acesso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-your-workload-service-architecture.html\" target=\"_blank\" rel=\"noopener noreferrer\">Design your workload service architecture - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-05-016-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-05-016-C002", "modulo": "05", "assunto": "Balanceamento, disponibilidade e Auto Scaling", "campos": {"Pergunta": "\u003cp>Por que duplicar servidores sem revisar estado não garante escalabilidade correta?\u003c/p>", "Resposta": "\u003cp>Requisições podem depender de dados que existem apenas em um servidor.\u003c/p>", "Comentarios": "\u003cp>Escala exige desenho de comunicação, estado e concorrência.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Balanceamento, disponibilidade e Auto Scaling", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-your-workload-service-architecture.html\" target=\"_blank\" rel=\"noopener noreferrer\">Design your workload service architecture - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-05-016-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-001-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Uma aplicação exige um disco formatado e anexado a uma VM. Qual modelo de storage é esperado?\u003c/p>", "Resposta": "\u003cp>Armazenamento em bloco.\u003c/p>", "Comentarios": "\u003cp>Um bucket de objetos não equivale diretamente a um disco do sistema operacional.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/storage-services.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Storage category iconStorage - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-06-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-001-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Várias instâncias Linux precisam montar o mesmo filesystem por NFS. Qual serviço avaliar?\u003c/p>", "Resposta": "\u003cp>Amazon EFS.\u003c/p>", "Comentarios": "\u003cp>Selecionar armazenamento por protocolo e semântica, não só por capacidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/storage-services.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Storage category iconStorage - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-06-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-001-C003", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Arquivos acessados por API HTTP sem necessidade de filesystem compartilhado combinam com qual modelo?\u003c/p>", "Resposta": "\u003cp>Armazenamento de objetos.\u003c/p>", "Comentarios": "\u003cp>Amazon S3 é a opção central para esse padrão.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/storage-services.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Storage category iconStorage - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-06-001-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-002-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>O que identifica um objeto dentro de um bucket S3?\u003c/p>", "Resposta": "\u003cp>Sua chave, com a versão quando aplicável.\u003c/p>", "Comentarios": "\u003cp>Pastas exibidas no console normalmente representam prefixos das chaves.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingObjects.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon S3 objects overview - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-002-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Um prefixo S3 é necessariamente um diretório físico como em um filesystem?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A organização visual não transforma o modelo de objetos em um filesystem POSIX.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingObjects.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon S3 objects overview - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-003-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Após um PUT bem-sucedido no S3, a leitura do objeto usa consistência forte?\u003c/p>", "Resposta": "\u003cp>Sim, para as operações de leitura de objetos descritas pelo modelo atual.\u003c/p>", "Comentarios": "\u003cp>Não confundir consistência do armazenamento com caches de clientes ou CDN.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html#ConsistencyModel\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon S3? - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-003-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Uma cópia antiga servida por CloudFront prova que o S3 tem consistência eventual para GET?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A versão pode estar em cache na camada de entrega.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html#ConsistencyModel\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon S3? - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-004-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Como versioning ajuda após sobrescrever um objeto?\u003c/p>", "Resposta": "\u003cp>Mantendo versões que podem ser recuperadas conforme a configuração.\u003c/p>", "Comentarios": "\u003cp>É preciso gerenciar retenção e custo das versões anteriores.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html\" target=\"_blank\" rel=\"noopener noreferrer\">Retaining multiple versions of objects with S3 Versioning - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-004-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>O que uma exclusão simples normalmente cria em um bucket com versioning habilitado?\u003c/p>", "Resposta": "\u003cp>Um delete marker como versão atual.\u003c/p>", "Comentarios": "\u003cp>As versões anteriores não são necessariamente removidas por essa operação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/DeleteMarker.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with delete markers - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-004-C003", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Versioning impede que alguém autorizado exclua permanentemente uma versão específica?\u003c/p>", "Resposta": "\u003cp>Não, por si só.\u003c/p>", "Comentarios": "\u003cp>Controles como Object Lock podem acrescentar proteção de retenção.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/DeleteMarker.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with delete markers - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-004-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-005-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Para dados frequentemente acessados e que exigem resiliência entre AZs, qual classe S3 geral avaliar?\u003c/p>", "Resposta": "\u003cp>S3 Standard.\u003c/p>", "Comentarios": "\u003cp>A frequência de acesso e requisitos de disponibilidade orientam a escolha.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html\" target=\"_blank\" rel=\"noopener noreferrer\">Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-005-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual diferença de resiliência importa entre Standard-IA e One Zone-IA?\u003c/p>", "Resposta": "\u003cp>One Zone-IA mantém dados em uma única AZ.\u003c/p>", "Comentarios": "\u003cp>Ela exige aceitar esse domínio de falha, como para dados reconstruíveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html\" target=\"_blank\" rel=\"noopener noreferrer\">Understanding and managing Amazon S3 storage classes - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-006-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual classe S3 é voltada a padrões de acesso desconhecidos ou variáveis, com movimentação automática entre tiers?\u003c/p>", "Resposta": "\u003cp>S3 Intelligent-Tiering.\u003c/p>", "Comentarios": "\u003cp>Verificar custos de monitoramento e características dos tiers utilizados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering.html\" target=\"_blank\" rel=\"noopener noreferrer\">Managing storage costs with Amazon S3 Intelligent-Tiering - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-006-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Intelligent-Tiering significa que todos os objetos irão imediatamente para armazenamento de arquivo?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Movimentações dependem dos padrões de acesso e das opções habilitadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering.html\" target=\"_blank\" rel=\"noopener noreferrer\">Managing storage costs with Amazon S3 Intelligent-Tiering - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-007-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual classe Glacier oferece acesso em milissegundos a objetos raramente acessados?\u003c/p>", "Resposta": "\u003cp>S3 Glacier Instant Retrieval.\u003c/p>", "Comentarios": "\u003cp>O nome Glacier não implica sempre restauração demorada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/glacier-storage-classes.html\" target=\"_blank\" rel=\"noopener noreferrer\">Understanding S3 Glacier storage classes for long-term data storage - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-007-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Objetos em Glacier Flexible Retrieval ou Deep Archive são lidos diretamente como objetos Standard sem restauração?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Planejar restauração e tempo de recuperação conforme a classe e a modalidade escolhida.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/glacier-storage-classes.html\" target=\"_blank\" rel=\"noopener noreferrer\">Understanding S3 Glacier storage classes for long-term data storage - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-007-C003", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual requisito pode impedir usar Deep Archive para um dado?\u003c/p>", "Resposta": "\u003cp>Necessidade de acesso imediato.\u003c/p>", "Comentarios": "\u003cp>Menor custo de armazenamento não atende toda exigência de recuperação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/glacier-storage-classes.html\" target=\"_blank\" rel=\"noopener noreferrer\">Understanding S3 Glacier storage classes for long-term data storage - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-007-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-008-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual classe S3 é voltada a acesso de baixa latência em uma única AZ usando directory buckets?\u003c/p>", "Resposta": "\u003cp>S3 Express One Zone.\u003c/p>", "Comentarios": "\u003cp>A escolha envolve um domínio de falha diferente de classes multizona.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/directory-bucket-high-performance.html\" target=\"_blank\" rel=\"noopener noreferrer\">High performance workloads - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-008-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>É adequado presumir que S3 Express One Zone oferece a mesma distribuição entre AZs de S3 Standard?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A decisão deve considerar explicitamente o requisito de resiliência.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/directory-bucket-high-performance.html\" target=\"_blank\" rel=\"noopener noreferrer\">High performance workloads - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-009-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual recurso automatiza transições de classe e expiração de objetos S3?\u003c/p>", "Resposta": "\u003cp>S3 Lifecycle.\u003c/p>", "Comentarios": "\u003cp>As regras precisam respeitar as condições e transições suportadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html\" target=\"_blank\" rel=\"noopener noreferrer\">Managing the lifecycle of objects - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-009-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-009-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Uma regra de expiração da versão atual elimina necessariamente todas as versões antigas?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Versões não atuais têm ações de lifecycle próprias.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html\" target=\"_blank\" rel=\"noopener noreferrer\">Managing the lifecycle of objects - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-010-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Por que escolher classe S3 apenas pelo custo por GB armazenado pode ser errado?\u003c/p>", "Resposta": "\u003cp>Existem custos e condições de requisição, recuperação, tamanho e retenção mínima.\u003c/p>", "Comentarios": "\u003cp>O padrão de uso determina o custo total.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://aws.amazon.com/s3/pricing/\" target=\"_blank\" rel=\"noopener noreferrer\">S3 Pricing\u003c/a>\u003cbr>\u003csmall>SAA-06-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-010-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Objetos pequenos e acessados frequentemente sempre ficam mais baratos em classes infrequentes?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Cobranças mínimas e de acesso podem superar a economia de armazenamento.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://aws.amazon.com/s3/pricing/\" target=\"_blank\" rel=\"noopener noreferrer\">S3 Pricing\u003c/a>\u003cbr>\u003csmall>SAA-06-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-011-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Como multipart upload ajuda a enviar um objeto grande?\u003c/p>", "Resposta": "\u003cp>Divide o envio em partes que podem ser transferidas e repetidas independentemente.\u003c/p>", "Comentarios": "\u003cp>Falhar uma parte não exige necessariamente reenviar todo o objeto.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Uploading and copying objects using multipart upload in Amazon S3 - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-011-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Por que encerrar ou abortar uploads multipart incompletos?\u003c/p>", "Resposta": "\u003cp>Partes armazenadas podem continuar gerando custo.\u003c/p>", "Comentarios": "\u003cp>Lifecycle pode ajudar a remover uploads incompletos conforme a regra.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Uploading and copying objects using multipart upload in Amazon S3 - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-012-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual recurso S3 pode acelerar transferências de longa distância usando a rede de borda AWS?\u003c/p>", "Resposta": "\u003cp>S3 Transfer Acceleration.\u003c/p>", "Comentarios": "\u003cp>É necessário avaliar benefício para a origem e o padrão de transferência.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html\" target=\"_blank\" rel=\"noopener noreferrer\">Configuring fast, secure file transfers using Amazon S3 Transfer Acceleration - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-012-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-012-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Transfer Acceleration substitui autorização de acesso ao bucket?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Acelerar o caminho não concede permissão aos dados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html\" target=\"_blank\" rel=\"noopener noreferrer\">Configuring fast, secure file transfers using Amazon S3 Transfer Acceleration - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-012-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-013-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual diferença entre SRR e CRR no S3?\u003c/p>", "Resposta": "\u003cp>SRR replica na mesma região; CRR replica entre regiões.\u003c/p>", "Comentarios": "\u003cp>Ambas dependem da configuração e do conjunto de objetos elegíveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html\" target=\"_blank\" rel=\"noopener noreferrer\">Replicating objects within and across Regions - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-013-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-013-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Habilitar uma regra de replicação cobre automaticamente todo objeto antigo que já existia?\u003c/p>", "Resposta": "\u003cp>Não necessariamente. Para objetos existentes, avaliar S3 Batch Replication.\u003c/p>", "Comentarios": "\u003cp>Distinguir replicação contínua de cópia retroativa.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html\" target=\"_blank\" rel=\"noopener noreferrer\">Replicating objects within and across Regions - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-013-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-013-C003", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Replicação substitui retenção e proteção contra exclusões indevidas em todos os cenários?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Uma estratégia de proteção precisa considerar alterações propagadas e política de retenção.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html\" target=\"_blank\" rel=\"noopener noreferrer\">Replicating objects within and across Regions - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-013-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-014-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual recurso S3 oferece retenção WORM para versões de objetos?\u003c/p>", "Resposta": "\u003cp>S3 Object Lock.\u003c/p>", "Comentarios": "\u003cp>Protege contra substituição ou exclusão conforme o modo e a retenção.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html\" target=\"_blank\" rel=\"noopener noreferrer\">Locking objects with Object Lock - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-014-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-014-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual diferença essencial existe entre governance mode e compliance mode?\u003c/p>", "Resposta": "\u003cp>Governance permite bypass por autorização específica; compliance impõe retenção que não pode ser encurtada pelos usuários, inclusive root.\u003c/p>", "Comentarios": "\u003cp>Escolher o modo conforme o requisito de proteção.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Locking objects with Object Lock - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-06-014-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-014-C003", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Legal hold exige necessariamente uma data final predefinida?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u00 l>SAA-06-029-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-030-C001", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Qual família de serviço conecta armazenamento local a serviços de storage AWS usando interfaces compatíveis?\u003c/p>", "Resposta": "\u003cp>AWS Storage Gateway.\u003c/p>", "Comentarios": "\u003cp>O tipo de gateway depende de arquivo, volume ou fita.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://aws.amazon.com/storagegateway/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Storage Gateway FAQs | Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-06-030-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-06-030-C002", "modulo": "06", "assunto": "S3 e escolha de armazenamento", "campos": {"Pergunta": "\u003cp>Por que escolher o tipo de gateway pelo protocolo da aplicação?\u003c/p>", "Resposta": "\u003cp>A aplicação precisa continuar acessando os dados pela interface suportada.\u003c/p>", "Comentarios": "\u003cp>Migração de armazenamento não elimina requisitos de compatibilidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3 e escolha de armazenamento", "Fonte": "\u003ca href=\"https://aws.amazon.com/storagegateway/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Storage Gateway FAQs | Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-06-030-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-001-C001", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>GetObject é permitido, mas um objeto SSE-KMS retorna AccessDenied. O que revisar além do bucket?\u003c/p>", "Resposta": "\u003cp>Permissão de uso da chave, key policy e demais controles KMS.\u003c/p>", "Comentarios": "\u003cp>A autorização S3 não substitui autorização criptográfica.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/troubleshoot-403-errors.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot access denied (403 Forbidden) errors in Amazon S3 - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-001-C002", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Um Deny em bucket policy por condição de transporte pode bloquear um usuário com permissão IAM?\u003c/p>", "Resposta": "\u003cp>Sim.\u003c/p>", "Comentarios": "\u003cp>Uma negação explícita aplicável prevalece.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/troubleshoot-403-errors.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot access denied (403 Forbidden) errors in Amazon S3 - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-002-C001", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Após sobrescrever um objeto versionado, o que procurar para recuperar o conteúdo anterior?\u003c/p>", "Resposta": "\u003cp>A versão anterior do objeto.\u003c/p>", "Comentarios": "\u003cp>O identificador de versão distingue os conteúdos da mesma chave.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/RestoringPreviousVersions.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restoring previous versions - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-002-C002", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>O objeto parece excluído por delete marker. Todas as versões foram necessariamente perdidas?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Inspecionar versões antes de concluir que os dados foram removidos definitivamente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/RestoringPreviousVersions.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restoring previous versions - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-003-C001", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma regra de lifecycle não afeta os objetos esperados. O que conferir primeiro?\u003c/p>", "Resposta": "\u003cp>Filtros, prefixos, tags, idade e elegibilidade da ação.\u003c/p>", "Comentarios": "\u003cp>Uma regra existente pode não selecionar os objetos pretendidos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/troubleshoot-lifecycle.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshooting Amazon S3 Lifecycle issues - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-003-C002", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Habilitar lifecycle garante que a interface reflita toda transição instantaneamente?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>As ações de lifecycle seguem processamento assíncrono e condições do serviço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/troubleshoot-lifecycle.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshooting Amazon S3 Lifecycle issues - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-004-C001", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Que configuração básica dos buckets deve ser verificada para replicação S3 baseada em versões?\u003c/p>", "Resposta": "\u003cp>Versioning nos buckets envolvidos, conforme os requisitos.\u003c/p>", "Comentarios": "\u003cp>Também verificar role, políticas e criptografia.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-requirements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Requirements and considerations for replication - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-004-C002", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Objetos antigos ficaram fora de uma regra recém-criada. Isso prova falha da replicação contínua?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Pode ser necessário Batch Replication para conteúdo preexistente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-requirements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Requirements and considerations for replication - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-005-C001", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Desativar Block Public Access concede automaticamente leitura a todos?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Ainda seria necessária uma concessão de acesso correspondente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html\" target=\"_blank\" rel=\"noopener noreferrer\">Blocking public access to your Amazon S3 storage - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-005-C002", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma bucket policy pública não funciona com bloqueios públicos aplicáveis habilitados. O que está ocorrendo?\u003c/p>", "Resposta": "\u003cp>A proteção contra acesso público está restringindo a configuração ou o acesso.\u003c/p>", "Comentarios": "\u003cp>Corrigir a arquitetura pretendida sem remover controles indiscriminadamente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html\" target=\"_blank\" rel=\"noopener noreferrer\">Blocking public access to your Amazon S3 storage - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-006-C001", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma URL assinada por sessão temporária expirou antes do prazo anunciado na URL. Qual causa investigar?\u003c/p>", "Resposta": "\u003cp>Expiração ou revogação das credenciais da sessão.\u003c/p>", "Comentarios": "\u003cp>O prazo informado na URL não estende a vida das credenciais.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html\" target=\"_blank\" rel=\"noopener noreferrer\">Download and upload objects with presigned URLs - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-006-C002", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma URL pré-assinada deve ser publicada livremente enquanto válida?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Quem a possui pode usá-la conforme as condições da assinatura.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html\" target=\"_blank\" rel=\"noopener noreferrer\">Download and upload objects with presigned URLs - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-007-C001", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Um administrador não consegue excluir uma versão sob compliance mode antes do prazo. Isso é necessariamente erro de permissão?\u003c/p>", "Resposta": "\u003cp>Não. Pode ser o comportamento esperado da retenção.\u003c/p>", "Comentarios": "\u003cp>A proteção foi desenhada para resistir a exclusões antes do término.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Locking objects with Object Lock - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-007-C002", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Remover legal hold elimina automaticamente uma retenção temporal ainda ativa?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>São mecanismos distintos e podem coexistir.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Locking objects with Object Lock - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-07-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-008-C001", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>CloudFront recebe 403 de bucket privado após configurar OAC. Qual autorização revisar?\u003c/p>", "Resposta": "\u003cp>A política do bucket para a distribuição e as permissões KMS, se aplicáveis.\u003c/p>", "Comentarios": "\u003cp>Criar o OAC não resolve sozinho todos os controles do recurso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restrict access to an Amazon S3 origin - Amazon CloudFront\u003c/a>\u003cbr>\u003csmall>SAA-07-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-07-008-C002", "modulo": "07", "assunto": "S3: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Por que testar diretamente a URL pública do bucket não é suficiente para validar uma origem privada correta?\u003c/p>", "Resposta": "\u003cp>O acesso direto pode ser intencionalmente negado.\u003c/p>", "Comentarios": "\u003cp>O fluxo permitido é o acesso pela distribuição autorizada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "S3: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restrict access to an Amazon S3 origin - Amazon CloudFront\u003c/a>\u003cbr>\u003csmall>SAA-07-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-001-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Por que evitar CIDRs sobrepostos ao planejar VPCs que precisarão se comunicar?\u003c/p>", "Resposta": "\u003cp>A sobreposição dificulta ou impede roteamento direto em mecanismos como peering.\u003c/p>", "Comentarios": "\u003cp>Planejar endereçamento antes da integração evita redesenho posterior.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html\" target=\"_blank\" rel=\"noopener noreferrer\">VPC CIDR blocks - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-001-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Por que considerar crescimento ao escolher o tamanho de uma subnet?\u003c/p>", "Resposta": "\u003cp>Os recursos precisam de endereços disponíveis.\u003c/p>", "Comentarios": "\u003cp>Uma subnet sem IPs livres pode impedir novos lançamentos mesmo havendo quota de computação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html\" target=\"_blank\" rel=\"noopener noreferrer\">VPC CIDR blocks - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-001-C002 · Referência consultada em 05/10/2026\u
