.sm-card, .sm-card * { box-sizing: border-box; }
.sm-card { width: 100%; max-width: 760px; margin: 0 auto; color: var(--sm-text); overflow-wrap: anywhere; }
.sm-header { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin: 0 4px 24px; }
.sm-brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.sm-monogram { width: 49px; height: 49px; display: flex; align-items: center; justify-content: center; background: var(--sm-accent); color: var(--sm-bg); border-radius: 15px 15px 15px 4px; font-size: 25px; font-weight: 800; letter-spacing: -2px; flex-shrink: 0; }
.sm-monogram span { color: var(--sm-bg); }
.sm-brand-text { font-size: 12px; font-weight: 750; letter-spacing: 1.9px; line-height: 1.5; }
.sm-brand-text > span { display: block; margin-top: 4px; color: var(--sm-muted); font-size: 8px; letter-spacing: 1.6px; font-weight: 500; }
.sm-logo { max-width: 150px; display: flex; align-items: center; }
.sm-logo img { display: block; width: auto; max-width: 150px !important; max-height: 56px !important; height: auto; object-fit: contain; border-radius: 0; }
.sm-edition { color: var(--sm-muted); font-size: 9px; letter-spacing: 2px; }
.sm-panel { border: 1px solid var(--sm-line); border-top: 3px solid var(--sm-accent); border-radius: 22px; padding: 30px 36px 32px; background: var(--sm-surface); box-shadow: 0 20px 55px #00000018; }
.sm-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.sm-chip { display: inline-block; background: var(--sm-accent-soft); color: var(--sm-accent); border: 1px solid var(--sm-line); border-radius: 7px; padding: 6px 11px; font-size: 10px; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }
.sm-side { font-size: 9px; color: var(--sm-muted); letter-spacing: 1.5px; white-space: nowrap; }
.sm-side > span { margin-left: 8px; font-size: 18px; }

.sm-question { margin-top: 30px; }
.sm-label { display: flex; align-items: center; gap: 9px; font-size: 10px; letter-spacing: 2px; font-weight: 700; color: var(--sm-muted); margin-bottom: 16px; }
.sm-dot { width: 6px; height: 6px; background: var(--sm-accent); border-radius: 50%; }

.sm-question-text p { margin: 0 0 .6em; }
.sm-question-text p:last-child { margin-bottom: 0; }

.sm-reveal-hint strong { color: var(--sm-text); font-weight: 600; }
.sm-back .sm-question-text { font-size: 24px; }
.sm-divider { height: 1px; border: 0; background: var(--sm-line); margin: 27px 0; }
.sm-answer .sm-label { color: var(--sm-accent); }

.sm-answer-text > :last-child, .sm-more-content > :last-child { margin-bottom: 0; }
.sm-more { border: 1px solid var(--sm-line); background: var(--sm-inset); border-radius: 12px; margin-top: 28px; overflow: hidden; }
.sm-more summary { display: flex; align-items: center; gap: 12px; list-style: none; cursor: pointer; padding: 16px 18px; min-height: 62px; font-size: 14px; font-weight: 600; user-select: none; }
.sm-more summary::-webkit-details-marker { display: none; }
.sm-more summary::marker { content: ""; }
.sm-more summary:hover { background: var(--sm-accent-soft); }

.sm-chevron { margin-left: auto; color: var(--sm-muted); transition: transform .18s ease; }
.sm-more[open] .sm-more-icon { transform: rotate(45deg); }
.sm-more[open] .sm-chevron { transform: rotate(180deg); }
.sm-more-content { border-top: 1px solid var(--sm-line); padding: 20px; color: var(--sm-muted); font-size: 16px; line-height: 1.8; }
.sm-source { display: flex; gap: 12px; border-top: 1px solid var(--sm-line); padding-top: 18px; margin-top: 24px; color: var(--sm-muted); font-size: 12px; }
.sm-source > span { font-size: 8px; letter-spacing: 1.5px; padding-top: 4px; flex-shrink: 0; }
.sm-card a { color: var(--sm-link); text-underline-offset: 4px; }
.sm-card img { max-width: 100% !important; height: auto; border-radius: 8px; }
.sm-card video { max-width: 100%; }
.sm-card pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sm-inset); border: 1px solid var(--sm-line); border-radius: 8px; padding: 14px; font-size: .85em; }
.sm-card code { font-family: Consolas, monospace; }
.sm-card table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: .85em; }
.sm-card th, .sm-card td { padding: 9px; border: 1px solid var(--sm-line); text-align: left; }
.sm-card blockquote { border-left: 3px solid var(--sm-accent); padding-left: 16px; margin: 16px 0; }
.sm-card ul, .sm-card ol { padding-left: 24px; }
.sm-card li + li { margin-top: 8px; }
.sm-card mark { background: var(--sm-accent-soft); color: var(--sm-accent); padding: 0 4px; border-radius: 3px; }
.sm-footer { margin: 23px auto 0; padding: 0 8px; text-align: center; color: var(--sm-muted); font-size: 10px; line-height: 1.8; }

.sm-footer strong { font-weight: 500; }
.sm-footer a { display: inline-block; padding: 8px; text-decoration: none; font-size: 11px; letter-spacing: .4px; }
.sm-footer a:hover { text-decoration: underline; }
.sm-footer small { display: block; font-size: 9px; }

@media (prefers-reduced-motion: reduce) { .sm-card * { transition: none !important; } }
@media print { .card { background: white; } .sm-panel { box-shadow: none; } }

<script type="application/json" id="payload">{"cards": [{"id": "SAA-01-001-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O que diferencia uma região AWS de uma zona de disponibilidade?\u003c/p>", "Resposta": "\u003cp>Uma região contém várias zonas de disponibilidade; cada AZ reúne um ou mais datacenters isolados.\u003c/p>", "Comentarios": "\u003cp>Distribuir recursos entre AZs reduz a dependência de um único local físico.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/global-infrastructure.html\" target=\"_blank\" rel=\"noopener noreferrer\">Global infrastructure - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-01-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-001-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Uma aplicação deve sobreviver à falha de um datacenter. Qual distribuição considerar primeiro?\u003c/p>", "Resposta": "\u003cp>Implantar componentes redundantes em múltiplas AZs.\u003c/p>", "Comentarios": "\u003cp>Criar duas instâncias na mesma AZ não garante isolamento contra uma falha zonal.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/global-infrastructure.html\" target=\"_blank\" rel=\"noopener noreferrer\">Global infrastructure - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-01-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-001-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Qual é a finalidade de uma localização de borda em uma CDN?\u003c/p>", "Resposta": "\u003cp>Aproximar a entrega de conteúdo dos usuários.\u003c/p>", "Comentarios": "\u003cp>A borda complementa a região de origem; não substitui todos os serviços regionais.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon CloudFront? - Amazon CloudFront\u003c/a>\u003cbr>\u003csmall>SAA-01-001-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-002-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Quem atualiza o sistema operacional convidado de uma instância EC2?\u003c/p>", "Resposta": "\u003cp>O cliente.\u003c/p>", "Comentarios": "\u003cp>EC2 oferece infraestrutura; o cliente continua responsável pelo software instalado na instância.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://aws.amazon.com/compliance/shared-responsibility-model/\" target=\"_blank\" rel=\"noopener noreferrer\">Shared Responsibility Model - Amazon Web Services (AWS)\u003c/a>\u003cbr>\u003csmall>SAA-01-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-002-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Quem protege fisicamente os datacenters da AWS?\u003c/p>", "Resposta": "\u003cp>A AWS.\u003c/p>", "Comentarios": "\u003cp>Esse controle faz parte da segurança da infraestrutura da nuvem.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://aws.amazon.com/compliance/shared-responsibility-model/\" target=\"_blank\" rel=\"noopener noreferrer\">Shared Responsibility Model - Amazon Web Services (AWS)\u003c/a>\u003cbr>\u003csmall>SAA-01-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-002-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Ao usar S3, quem define quais pessoas podem acessar os objetos?\u003c/p>", "Resposta": "\u003cp>O cliente, por meio dos controles de acesso.\u003c/p>", "Comentarios": "\u003cp>Um serviço gerenciado não elimina a responsabilidade sobre permissões e dados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://aws.amazon.com/compliance/shared-responsibility-model/\" target=\"_blank\" rel=\"noopener noreferrer\">Shared Responsibility Model - Amazon Web Services (AWS)\u003c/a>\u003cbr>\u003csmall>SAA-01-002-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-002-C004", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>No RDS, usar um serviço gerenciado elimina a responsabilidade por usuários do banco?\u003c/p>", "Resposta": "\u003cp>Não. O cliente ainda administra acessos e configurações sob seu controle.\u003c/p>", "Comentarios": "\u003cp>A fronteira de responsabilidade depende do serviço, não apenas do nome gerenciado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://aws.amazon.com/compliance/shared-responsibility-model/\" target=\"_blank\" rel=\"noopener noreferrer\">Shared Responsibility Model - Amazon Web Services (AWS)\u003c/a>\u003cbr>\u003csmall>SAA-01-002-C004 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-003-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O que mede a disponibilidade de um sistema?\u003c/p>", "Resposta": "\u003cp>A proporção de tempo em que ele consegue prestar o serviço esperado.\u003c/p>", "Comentarios": "\u003cp>Durabilidade trata da preservação dos dados, não de conseguir acessá-los agora.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html\" target=\"_blank\" rel=\"noopener noreferrer\">Availability - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-003-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Um objeto está preservado, mas temporariamente inacessível. Qual propriedade foi afetada diretamente?\u003c/p>", "Resposta": "\u003cp>Disponibilidade.\u003c/p>", "Comentarios": "\u003cp>A indisponibilidade não implica necessariamente perda permanente do dado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html\" target=\"_blank\" rel=\"noopener noreferrer\">Availability - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-003-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Qual a diferença entre recuperação de falha e tolerância a falhas?\u003c/p>", "Resposta": "\u003cp>Recuperação restabelece o serviço; tolerância busca mantê-lo funcionando durante a falha.\u003c/p>", "Comentarios": "\u003cp>O requisito de interrupção aceitável orienta a arquitetura.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html\" target=\"_blank\" rel=\"noopener noreferrer\">Availability - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-003-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-004-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O que é escalar horizontalmente uma aplicação?\u003c/p>", "Resposta": "\u003cp>Adicionar mais unidades de execução, como instâncias ou tarefas.\u003c/p>", "Comentarios": "\u003cp>O processamento deve conseguir distribuir trabalho entre essas unidades.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-your-workload-to-withstand-component-failures.html\" target=\"_blank\" rel=\"noopener noreferrer\">Design your workload to withstand component failures - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-004-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O que é escalar verticalmente um banco de dados?\u003c/p>", "Resposta": "\u003cp>Aumentar os recursos da unidade existente, como CPU e memória.\u003c/p>", "Comentarios": "\u003cp>Isso não cria automaticamente redundância nem escala de escrita distribuída.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-your-workload-to-withstand-component-failures.html\" target=\"_blank\" rel=\"noopener noreferrer\">Design your workload to withstand component failures - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-004-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Qual característica distingue elasticidade de simplesmente possuir grande capacidade?\u003c/p>", "Resposta": "\u003cp>Ajustar capacidade conforme a demanda aumenta ou diminui.\u003c/p>", "Comentarios": "\u003cp>Manter servidores grandes ociosos oferece capacidade, mas não demonstra elasticidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-your-workload-to-withstand-component-failures.html\" target=\"_blank\" rel=\"noopener noreferrer\">Design your workload to withstand component failures - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-004-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-005-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O que significa latência em uma requisição?\u003c/p>", "Resposta": "\u003cp>O tempo decorrido para obter a resposta ou concluir a operação.\u003c/p>", "Comentarios": "\u003cp>Uma média baixa pode esconder usuários com respostas muito lentas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/monitor-workload-resources.html\" target=\"_blank\" rel=\"noopener noreferrer\">Monitor workload resources - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-005-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O que significa throughput em um sistema?\u003c/p>", "Resposta": "\u003cp>A quantidade de trabalho ou dados processados por unidade de tempo.\u003c/p>", "Comentarios": "\u003cp>Throughput alto não garante baixa latência de cada requisição.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/monitor-workload-resources.html\" target=\"_blank\" rel=\"noopener noreferrer\">Monitor workload resources - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-005-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Qual a diferença entre IOPS e throughput de armazenamento?\u003c/p>", "Resposta": "\u003cp>IOPS conta operações por segundo; throughput mede volume de dados por segundo.\u003c/p>", "Comentarios": "\u003cp>O tamanho médio de cada operação liga as duas métricas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/monitor-workload-resources.html\" target=\"_blank\" rel=\"noopener noreferrer\">Monitor workload resources - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-005-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-005-C004", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Um disco atende poucas operações grandes por segundo. Qual métrica pode ser o gargalo mesmo com IOPS baixo?\u003c/p>", "Resposta": "\u003cp>Throughput em bytes por segundo.\u003c/p>", "Comentarios": "\u003cp>Não escolher volume apenas pelo número de operações.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/monitor-workload-resources.html\" target=\"_blank\" rel=\"noopener noreferrer\">Monitor workload resources - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-005-C004 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-006-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Por que guardar a sessão apenas na memória de uma instância dificulta o Auto Scaling?\u003c/p>", "Resposta": "\u003cp>A próxima requisição pode chegar a outra instância sem o estado da sessão.\u003c/p>", "Comentarios": "\u003cp>A perda da instância também pode perder o estado local.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/elasticache-use-cases.html\" target=\"_blank\" rel=\"noopener noreferrer\">Common ElastiCache Use Cases and How ElastiCache Can Help - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-01-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-006-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Como permitir que qualquer servidor de aplicação atenda a mesma sessão?\u003c/p>", "Resposta": "\u003cp>Externalizar o estado para um armazenamento compartilhado adequado.\u003c/p>", "Comentarios": "\u003cp>O armazenamento da sessão também precisa de disponibilidade e controles de acesso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/elasticache-use-cases.html\" target=\"_blank\" rel=\"noopener noreferrer\">Common ElastiCache Use Cases and How ElastiCache Can Help - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-01-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-006-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Aplicação stateless significa que o sistema não possui dados persistentes?\u003c/p>", "Resposta": "\u003cp>Não. Significa que a unidade de execução não depende de estado local entre requisições.\u003c/p>", "Comentarios": "\u003cp>O estado pode existir em bancos, caches ou outros serviços externos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/elasticache-use-cases.html\" target=\"_blank\" rel=\"noopener noreferrer\">Common ElastiCache Use Cases and How ElastiCache Can Help - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-01-006-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-007-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Por que um serviço gerenciado costuma atender a um requisito de menor esforço operacional?\u003c/p>", "Resposta": "\u003cp>Transfere parte da administração da infraestrutura ou plataforma ao provedor.\u003c/p>", "Comentarios": "\u003cp>Ainda é necessário configurar segurança, observabilidade e capacidade conforme o serviço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-education-hybrid-multicloud/managed-services.html\" target=\"_blank\" rel=\"noopener noreferrer\">Adopt cloud-native, managed services wherever possible and practical - AWS Prescriptive Guidance\u003c/a>\u003cbr>\u003csmall>SAA-01-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-007-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Quando uma solução autogerenciada pode ser necessária apesar da operação adicional?\u003c/p>", "Resposta": "\u003cp>Quando requisitos de controle ou compatibilidade não são atendidos pela opção gerenciada.\u003c/p>", "Comentarios": "\u003cp>Menor operação só desempata alternativas que cumprem as restrições obrigatórias.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-education-hybrid-multicloud/managed-services.html\" target=\"_blank\" rel=\"noopener noreferrer\">Adopt cloud-native, managed services wherever possible and practical - AWS Prescriptive Guidance\u003c/a>\u003cbr>\u003csmall>SAA-01-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-008-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Uma instância EC2 pode estar simultaneamente em duas AZs?\u003c/p>", "Resposta": "\u003cp>Não. Cada instância é criada em uma AZ.\u003c/p>", "Comentarios": "\u003cp>Para redundância zonal, criar instâncias distintas em AZs diferentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/resources.html\" target=\"_blank\" rel=\"noopener noreferrer\">Manage your Amazon EC2 resources - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-01-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-008-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Um volume EBS comum pode ser anexado diretamente a uma instância de outra AZ?\u003c/p>", "Resposta": "\u003cp>Não. Volume e instância devem estar na mesma AZ.\u003c/p>", "Comentarios": "\u003cp>Para mover dados, pode-se usar snapshot e criar outro volume na AZ de destino.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/resources.html\" target=\"_blank\" rel=\"noopener noreferrer\">Manage your Amazon EC2 resources - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-01-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-008-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Por que identificar se um recurso é zonal ou regional antes de desenhar alta disponibilidade?\u003c/p>", "Resposta": "\u003cp>Para localizar domínios de falha e dependências compartilhadas.\u003c/p>", "Comentarios": "\u003cp>Uma aplicação em duas AZs pode continuar dependendo de um recurso zonal único.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/resources.html\" target=\"_blank\" rel=\"noopener noreferrer\">Manage your Amazon EC2 resources - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-01-008-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-009-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Em um cenário, processar pagamentos é requisito funcional ou não funcional?\u003c/p>", "Resposta": "\u003cp>Funcional.\u003c/p>", "Comentarios": "\u003cp>Ele descreve uma capacidade de negócio que o sistema deve oferecer.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Well-Architected Framework - AWS Well-Architected Framework\u003c/a>\u003cbr>\u003csmall>SAA-01-009-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-009-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Em um cenário, responder em até determinado tempo é requisito funcional ou não funcional?\u003c/p>", "Resposta": "\u003cp>Não funcional.\u003c/p>", "Comentarios": "\u003cp>Ele restringe a qualidade de execução, como desempenho, segurança ou disponibilidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Well-Architected Framework - AWS Well-Architected Framework\u003c/a>\u003cbr>\u003csmall>SAA-01-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-009-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Qual deve ser a primeira análise ao comparar duas arquiteturas de uma questão?\u003c/p>", "Resposta": "\u003cp>Verificar quais atendem a todas as restrições obrigatórias.\u003c/p>", "Comentarios": "\u003cp>Só depois comparar custo, desempenho ou esforço operacional solicitado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Well-Architected Framework - AWS Well-Architected Framework\u003c/a>\u003cbr>\u003csmall>SAA-01-009-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-010-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O que representa o RTO?\u003c/p>", "Resposta": "\u003cp>O tempo máximo aceitável para recuperar o serviço após uma interrupção.\u003c/p>", "Comentarios": "\u003cp>É um objetivo de recuperação, não o intervalo de backup.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://aws.amazon.com/what-is/recovery-time-objective/\" target=\"_blank\" rel=\"noopener noreferrer\">What is Recovery Time Objective (RTO)? - RTO Explained - AWS\u003c/a>\u003cbr>\u003csmall>SAA-01-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-010-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O que representa o RPO?\u003c/p>", "Resposta": "\u003cp>A perda de dados aceitável, expressa como intervalo de tempo.\u003c/p>", "Comentarios": "\u003cp>Ele orienta frequência de cópia e estratégia de replicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://aws.amazon.com/what-is/recovery-time-objective/\" target=\"_blank\" rel=\"noopener noreferrer\">What is Recovery Time Objective (RTO)? - RTO Explained - AWS\u003c/a>\u003cbr>\u003csmall>SAA-01-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-010-C003", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Backups diários garantem RPO de cinco minutos?\u003c/p>", "Resposta": "\u003cp>Não, isoladamente não.\u003c/p>", "Comentarios": "\u003cp>A frequência de proteção precisa ser compatível com a perda de dados tolerada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://aws.amazon.com/what-is/recovery-time-objective/\" target=\"_blank\" rel=\"noopener noreferrer\">What is Recovery Time Objective (RTO)? - RTO Explained - AWS\u003c/a>\u003cbr>\u003csmall>SAA-01-010-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-010-C004", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Uma restauração preserva todos os dados, mas demora horas. Qual objetivo pode ser violado?\u003c/p>", "Resposta": "\u003cp>O RTO.\u003c/p>", "Comentarios": "\u003cp>Preservar dados não significa recuperar o serviço no prazo exigido.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://aws.amazon.com/what-is/recovery-time-objective/\" target=\"_blank\" rel=\"noopener noreferrer\">What is Recovery Time Objective (RTO)? - RTO Explained - AWS\u003c/a>\u003cbr>\u003csmall>SAA-01-010-C004 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-011-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>A alternativa com menor preço por hora é sempre a de menor custo total?\u003c/p>", "Resposta": "\u003cp>Não. É preciso considerar uso, transferência, armazenamento e operação.\u003c/p>", "Comentarios": "\u003cp>Um componente barato pode exigir outros recursos caros para cumprir os requisitos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Cost Optimization Pillar - AWS Well-Architected Framework - Cost Optimization Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-011-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Uma arquitetura mais barata que viola o RPO é uma solução válida para o cenário?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Otimização de custo deve preservar os requisitos obrigatórios.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Cost Optimization Pillar - AWS Well-Architected Framework - Cost Optimization Pillar\u003c/a>\u003cbr>\u003csmall>SAA-01-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-012-C001", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>Por que separar apresentação, aplicação e banco em camadas?\u003c/p>", "Resposta": "\u003cp>Para controlar comunicação e escalar componentes conforme suas funções.\u003c/p>", "Comentarios": "\u003cp>A separação lógica precisa ser acompanhada de regras de acesso adequadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Building a Scalable and Secure Multi-VPC AWS Network Infrastructure - Building a Scalable and Secure Multi-VPC AWS Network Infrastructure\u003c/a>\u003cbr>\u003csmall>SAA-01-012-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-01-012-C002", "modulo": "01", "assunto": "Fundamentos e leitura de cenários", "campos": {"Pergunta": "\u003cp>O banco de uma aplicação web precisa ser publicamente acessível porque o site é público?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A camada de aplicação pode acessar um banco privado, enquanto só a entrada web é pública.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Fundamentos e leitura de cenários", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Building a Scalable and Secure Multi-VPC AWS Network Infrastructure - Building a Scalable and Secure Multi-VPC AWS Network Infrastructure\u003c/a>\u003cbr>\u003csmall>SAA-01-012-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-001-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual identidade IAM é apropriada para uma aplicação EC2 acessar serviços AWS sem chaves fixas?\u003c/p>", "Resposta": "\u003cp>Uma IAM role associada à instância por um instance profile.\u003c/p>", "Comentarios": "\u003cp>A aplicação obtém credenciais temporárias da role.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM Identities - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-001-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual é a função de um grupo IAM?\u003c/p>", "Resposta": "\u003cp>Agrupar usuários IAM para administrar permissões em conjunto.\u003c/p>", "Comentarios": "\u003cp>Um grupo não possui credenciais nem pode assumir uma role.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM Identities - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-001-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Uma role IAM representa obrigatoriamente uma pessoa específica?\u003c/p>", "Resposta": "\u003cp>Não. É uma identidade assumível por entidades autorizadas.\u003c/p>", "Comentarios": "\u003cp>Pode atender pessoas federadas, aplicações ou serviços.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM Identities - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-001-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-002-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Quais componentes formam credenciais temporárias AWS?\u003c/p>", "Resposta": "\u003cp>Access key ID, secret access key e session token.\u003c/p>", "Comentarios": "\u003cp>O token de sessão faz parte da autenticação dessas credenciais.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp.html\" target=\"_blank\" rel=\"noopener noreferrer\">Temporary security credentials in IAM - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-002-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual propriedade reduz o risco de exposição prolongada de credenciais temporárias?\u003c/p>", "Resposta": "\u003cp>Elas expiram.\u003c/p>", "Comentarios": "\u003cp>A aplicação deve obter novas credenciais pelo mecanismo apropriado, não armazená-las como permanentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp.html\" target=\"_blank\" rel=\"noopener noreferrer\">Temporary security credentials in IAM - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-002-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Por que não embutir access keys de um usuário IAM em uma AMI?\u003c/p>", "Resposta": "\u003cp>Elas podem ser copiadas junto com a imagem e têm ciclo de vida independente das instâncias.\u003c/p>", "Comentarios": "\u003cp>Preferir roles e obtenção automática de credenciais temporárias.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp.html\" target=\"_blank\" rel=\"noopener noreferrer\">Temporary security credentials in IAM - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-002-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-003-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Em uma policy IAM, qual elemento especifica as operações permitidas ou negadas?\u003c/p>", "Resposta": "\u003cp>Action.\u003c/p>", "Comentarios": "\u003cp>Resource identifica os recursos; Condition restringe as circunstâncias.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM JSON policy element reference - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-003-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Em uma policy IAM, o que expressa Effect?\u003c/p>", "Resposta": "\u003cp>Se a declaração concede Allow ou estabelece Deny.\u003c/p>", "Comentarios": "\u003cp>A decisão final ainda considera as demais políticas aplicáveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM JSON policy element reference - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-003-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual elemento de uma policy limita uma permissão a uma condição como tag ou origem de rede?\u003c/p>", "Resposta": "\u003cp>Condition.\u003c/p>", "Comentarios": "\u003cp>A condição precisa usar chaves compatíveis com a requisição e o serviço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM JSON policy element reference - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-003-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-004-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Onde é anexada uma política baseada em identidade?\u003c/p>", "Resposta": "\u003cp>A uma identidade IAM, como usuário, grupo ou role.\u003c/p>", "Comentarios": "\u003cp>Ela descreve o que essa identidade pode fazer.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_identity-vs-resource.html\" target=\"_blank\" rel=\"noopener noreferrer\">Identity-based policies and resource-based policies - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-004-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Onde é aplicada uma política baseada em recurso?\u003c/p>", "Resposta": "\u003cp>No recurso que suporta esse tipo de política.\u003c/p>", "Comentarios": "\u003cp>Uma bucket policy do S3 é um exemplo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_identity-vs-resource.html\" target=\"_blank\" rel=\"noopener noreferrer\">Identity-based policies and resource-based policies - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-004-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Por que uma política de recurso normalmente especifica Principal?\u003c/p>", "Resposta": "\u003cp>Para indicar quais entidades podem ou não acessar o recurso.\u003c/p>", "Comentarios": "\u003cp>A política está vinculada ao recurso, não a uma única identidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_identity-vs-resource.html\" target=\"_blank\" rel=\"noopener noreferrer\">Identity-based policies and resource-based policies - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-004-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-005-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Um Allow em uma policy supera um Deny explícito aplicável em outra?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A negação explícita prevalece na avaliação de permissões.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html\" target=\"_blank\" rel=\"noopener noreferrer\">Policy evaluation logic - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-005-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>O que é negação implícita no IAM?\u003c/p>", "Resposta": "\u003cp>A ausência de uma concessão válida para a operação.\u003c/p>", "Comentarios": "\u003cp>Não é necessário escrever Deny para que uma operação sem permissão seja recusada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html\" target=\"_blank\" rel=\"noopener noreferrer\">Policy evaluation logic - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-005-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Adicionar AdministratorAccess sempre resolve um bloqueio causado por SCP?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Permissões de identidade continuam sujeitas aos limites organizacionais aplicáveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html\" target=\"_blank\" rel=\"noopener noreferrer\">Policy evaluation logic - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-005-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-006-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual pergunta uma trust policy de role responde?\u003c/p>", "Resposta": "\u003cp>Quem pode assumir a role e sob quais condições.\u003c/p>", "Comentarios": "\u003cp>Ela não define, sozinha, tudo que a sessão poderá fazer após assumir a role.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_terms-and-concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM roles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-006-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual pergunta a permissions policy da role responde?\u003c/p>", "Resposta": "\u003cp>Quais ações a role pode executar nos recursos.\u003c/p>", "Comentarios": "\u003cp>A trust policy controla quem obtém essa identidade.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_terms-and-concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM roles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-006-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Uma trust policy que permite assumir a role concede automaticamente leitura de S3?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A autorização das operações da sessão precisa ser definida pelas políticas aplicáveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_terms-and-concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM roles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-006-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-007-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Em acesso entre contas por AssumeRole, em qual conta é criada a role de destino?\u003c/p>", "Resposta": "\u003cp>Na conta que oferece o acesso delegado aos recursos.\u003c/p>", "Comentarios": "\u003cp>A identidade de origem precisa poder assumir a role e ser confiada pelo destino.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM tutorial: Delegate access across AWS accounts using IAM roles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-007-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Após AssumeRole, a aplicação usa suas chaves originais para agir como a role?\u003c/p>", "Resposta": "\u003cp>Não. Usa as credenciais temporárias retornadas para a sessão da role.\u003c/p>", "Comentarios": "\u003cp>A sessão possui permissões associadas à role, sujeitas aos controles aplicáveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM tutorial: Delegate access across AWS accounts using IAM roles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-007-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Por que conceder sts:AssumeRole na origem não basta quando a trust policy do destino rejeita o principal?\u003c/p>", "Resposta": "\u003cp>Porque a relação de confiança do destino também precisa autorizar a assunção.\u003c/p>", "Comentarios": "\u003cp>Acesso entre contas exige analisar os dois lados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM tutorial: Delegate access across AWS accounts using IAM roles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-007-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-008-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual problema o External ID ajuda a mitigar em roles assumidas por um prestador multicliente?\u003c/p>", "Resposta": "\u003cp>Confused deputy.\u003c/p>", "Comentarios": "\u003cp>Ele vincula a assunção ao contexto do cliente esperado pelo prestador.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html\" target=\"_blank\" rel=\"noopener noreferrer\">Access to AWS accounts owned by third parties - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-008-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>External ID deve ser tratado como substituto de uma senha secreta?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Ele é uma condição de contexto e pode ser visível a quem consulta a role.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html\" target=\"_blank\" rel=\"noopener noreferrer\">Access to AWS accounts owned by third parties - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-008-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Onde exigir External ID para um terceiro assumir uma role?\u003c/p>", "Resposta": "\u003cp>Em uma condição da trust policy.\u003c/p>", "Comentarios": "\u003cp>O terceiro deve enviar o valor correspondente ao chamar AssumeRole.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html\" target=\"_blank\" rel=\"noopener noreferrer\">Access to AWS accounts owned by third parties - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-008-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-009-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Uma permissions boundary concede permissões por conta própria?\u003c/p>", "Resposta": "\u003cp>Não. Ela limita permissões concedidas por políticas de identidade.\u003c/p>", "Comentarios": "\u003cp>Uma role sem concessões não passa a ter acesso só por receber uma boundary permissiva.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html\" target=\"_blank\" rel=\"noopener noreferrer\">Permissions boundaries for IAM entities - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-009-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-009-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Para que serve uma permissions boundary ao permitir que desenvolvedores criem roles?\u003c/p>", "Resposta": "\u003cp>Estabelecer o teto das permissões delegadas.\u003c/p>", "Comentarios": "\u003cp>A política que permite criar roles também deve exigir o uso da boundary adequada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html\" target=\"_blank\" rel=\"noopener noreferrer\">Permissions boundaries for IAM entities - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-009-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Uma session policy pode aumentar as permissões da role assumida?\u003c/p>", "Resposta": "\u003cp>Não. Ela pode restringir as permissões da sessão.\u003c/p>", "Comentarios": "\u003cp>A sessão não ganha operações que a role não possui.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html\" target=\"_blank\" rel=\"noopener noreferrer\">Permissions boundaries for IAM entities - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-009-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-010-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual recurso ajuda a encontrar acesso público ou entre contas em recursos suportados?\u003c/p>", "Resposta": "\u003cp>IAM Access Analyzer.\u003c/p>", "Comentarios": "\u003cp>O resultado precisa ser interpretado em relação à zona de confiança configurada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-010-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Como usar atividade observada para reduzir permissões de uma aplicação?\u003c/p>", "Resposta": "\u003cp>Gerar e revisar políticas com IAM Access Analyzer a partir de atividade suportada.\u003c/p>", "Comentarios": "\u003cp>Ausência de uso recente não prova que uma permissão nunca será necessária.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using AWS Identity and Access Management Access Analyzer - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-011-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>O usuário root deve ser usado nas tarefas administrativas diárias?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Usar acesso administrativo por identidades apropriadas e reservar root para necessidades específicas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html\" target=\"_blank\" rel=\"noopener noreferrer\">Root user best practices for your AWS account - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-011-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Por que habilitar MFA além de uma senha forte?\u003c/p>", "Resposta": "\u003cp>Para exigir um fator adicional de autenticação.\u003c/p>", "Comentarios": "\u003cp>MFA não substitui políticas de menor privilégio.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html\" target=\"_blank\" rel=\"noopener noreferrer\">Root user best practices for your AWS account - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-011-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Deve-se criar access keys de root para uma aplicação automatizada?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A aplicação deve usar uma identidade específica com acesso limitado, preferencialmente temporário.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html\" target=\"_blank\" rel=\"noopener noreferrer\">Root user best practices for your AWS account - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-011-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-012-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual serviço centraliza acesso de funcionários a múltiplas contas AWS?\u003c/p>", "Resposta": "\u003cp>IAM Identity Center.\u003c/p>", "Comentarios": "\u003cp>Ele permite gerenciar acesso integrado a uma fonte de identidades.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is IAM Identity Center? - AWS IAM Identity Center\u003c/a>\u003cbr>\u003csmall>SAA-02-012-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-012-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Uma empresa precisa criar um usuário IAM permanente em cada conta para cada funcionário?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Federação e IAM Identity Center podem fornecer acesso centralizado por credenciais temporárias.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is IAM Identity Center? - AWS IAM Identity Center\u003c/a>\u003cbr>\u003csmall>SAA-02-012-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-012-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>O que descreve um permission set no IAM Identity Center?\u003c/p>", "Resposta": "\u003cp>Um conjunto de permissões usado para conceder acesso a contas AWS.\u003c/p>", "Comentarios": "\u003cp>A atribuição conecta usuários ou grupos às contas e permissões desejadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is IAM Identity Center? - AWS IAM Identity Center\u003c/a>\u003cbr>\u003csmall>SAA-02-012-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-013-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual padrão costuma integrar login corporativo federado a roles AWS usando asserções?\u003c/p>", "Resposta": "\u003cp>SAML 2.0.\u003c/p>", "Comentarios": "\u003cp>A identidade autentica no provedor e obtém acesso federado conforme a confiança configurada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html\" target=\"_blank\" rel=\"noopener noreferrer\">Identity providers and federation into AWS - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-013-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-013-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual API STS troca um token de identidade web suportado por credenciais temporárias?\u003c/p>", "Resposta": "\u003cp>AssumeRoleWithWebIdentity.\u003c/p>", "Comentarios": "\u003cp>A role deve confiar no provedor e restringir os atributos relevantes do token.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html\" target=\"_blank\" rel=\"noopener noreferrer\">Identity providers and federation into AWS - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-013-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-014-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual é a função do instance profile no EC2?\u003c/p>", "Resposta": "\u003cp>Entregar uma IAM role à instância.\u003c/p>", "Comentarios": "\u003cp>O profile é o vínculo usado para disponibilizar credenciais da role ao workload.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html\" target=\"_blank\" rel=\"noopener noreferrer\">Use instance profiles - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-014-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-014-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Quem deve receber permissão para o código de uma Lambda ler um bucket?\u003c/p>", "Resposta": "\u003cp>A execution role da função.\u003c/p>", "Comentarios": "\u003cp>A permissão para invocar a função é um controle separado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html\" target=\"_blank\" rel=\"noopener noreferrer\">Defining Lambda function permissions with an execution role - AWS Lambda\u003c/a>\u003cbr>\u003csmall>SAA-02-014-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-015-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual é a ideia central de ABAC no IAM?\u003c/p>", "Resposta": "\u003cp>Autorizar acesso por atributos, frequentemente tags de principal e recurso.\u003c/p>", "Comentarios": "\u003cp>Pode reduzir a quantidade de políticas específicas quando muitos recursos seguem o mesmo padrão.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html\" target=\"_blank\" rel=\"noopener noreferrer\">Define permissions based on attributes with ABAC authorization - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-015-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-015-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual risco existe se usuários podem alterar livremente tags usadas para autorização?\u003c/p>", "Resposta": "\u003cp>Eles podem modificar atributos que influenciam o próprio acesso.\u003c/p>", "Comentarios": "\u003cp>O controle sobre criação e alteração de tags também deve ser protegido.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html\" target=\"_blank\" rel=\"noopener noreferrer\">Define permissions based on attributes with ABAC authorization - AWS Identity and Access Management\u003c/a>\u003cbr>\u003csmall>SAA-02-015-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-016-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual é a função principal de um Cognito user pool?\u003c/p>", "Resposta": "\u003cp>Gerenciar autenticação de usuários de aplicações e emitir tokens.\u003c/p>", "Comentarios": "\u003cp>É um diretório de usuários para a aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Cognito? - Amazon Cognito\u003c/a>\u003cbr>\u003csmall>SAA-02-016-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-016-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual é a função principal de um Cognito identity pool?\u003c/p>", "Resposta": "\u003cp>Fornecer credenciais AWS temporárias para identidades autorizadas.\u003c/p>", "Comentarios": "\u003cp>Pode usar tokens de user pools ou outros provedores.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Cognito? - Amazon Cognito\u003c/a>\u003cbr>\u003csmall>SAA-02-016-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-016-C003", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Um token de user pool é automaticamente uma access key para chamar S3?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A aplicação precisa do fluxo apropriado de autorização, como um identity pool para credenciais AWS.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Cognito? - Amazon Cognito\u003c/a>\u003cbr>\u003csmall>SAA-02-016-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-017-C001", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual opção fornece um Microsoft Active Directory gerenciado na AWS?\u003c/p>", "Resposta": "\u003cp>AWS Managed Microsoft AD.\u003c/p>", "Comentarios": "\u003cp>É adequada quando o cenário exige recursos de AD com infraestrutura gerenciada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "IAM, identidade e proteção de aplicações", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/what_is.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Directory Service? - AWS Directory Service\u003c/a>\u003cbr>\u003csmall>SAA-02-017-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-02-017-C002", "modulo": "02", "assunto": "IAM, identidade e proteção de aplicações", "campos": {"Pergunta": "\u003cp>Qual opção encaminha solicitações de diretório para um Active Directory existente?\u003c/p>", "Resposta": "\u003cp>AD Connector.\u003c/p>", "Comentarios": "\u003cp>Não é um novo diretório completo que substitui o AD de origem.\u003c/p>", "Logo": "", "Materia": "AW
