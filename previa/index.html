003c/small>"}}, {"id": "SAA-08-002-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>O que caracteriza uma subnet pública no roteamento IPv4 tradicional?\u003c/p>", "Resposta": "\u003cp>Uma rota para Internet Gateway.\u003c/p>", "Comentarios": "\u003cp>Uma instância ainda precisa de endereço e controles adequados para comunicação pública.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html\" target=\"_blank\" rel=\"noopener noreferrer\">Subnets for your VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-002-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Uma subnet com saída por NAT Gateway é necessariamente pública?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Saída via NAT permite manter instâncias sem acesso direto por Internet Gateway.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html\" target=\"_blank\" rel=\"noopener noreferrer\">Subnets for your VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-003-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Entre rotas que correspondem ao mesmo destino, qual princípio seleciona a mais específica?\u003c/p>", "Resposta": "\u003cp>Longest prefix match.\u003c/p>", "Comentarios": "\u003cp>Outras regras de prioridade podem importar quando os prefixos são iguais.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/route-tables-priority.html\" target=\"_blank\" rel=\"noopener noreferrer\">How route priority works - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-003-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Uma rota 10.0.0.0/16 é mais específica que 0.0.0.0/0?\u003c/p>", "Resposta": "\u003cp>Sim.\u003c/p>", "Comentarios": "\u003cp>O prefixo maior cobre um conjunto menor de destinos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/route-tables-priority.html\" target=\"_blank\" rel=\"noopener noreferrer\">How route priority works - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-004-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Uma EC2 IPv4 em subnet pública acessa a internet só porque existe um Internet Gateway na VPC?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>São necessários roteamento, endereço público apropriado e regras permitindo o tráfego.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">Enable internet access for a VPC using an internet gateway - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-004-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Internet Gateway funciona como uma política de segurança que libera todas as portas?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Security groups e NACLs continuam controlando tráfego.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">Enable internet access for a VPC using an internet gateway - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-005-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Qual é o papel de um NAT Gateway público em uma arquitetura IPv4 privada?\u003c/p>", "Resposta": "\u003cp>Permitir conexões iniciadas por recursos privados para destinos externos pela internet.\u003c/p>", "Comentarios": "\u003cp>Isso não torna os recursos privados diretamente acessíveis por conexões externas iniciadas do lado de fora.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">NAT gateways - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-005-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Um NAT Gateway substitui um bastion para conexões SSH iniciadas da internet?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O fluxo de NAT de saída não é uma publicação genérica de portas de entrada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">NAT gateways - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-006-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Qual risco existe quando subnets privadas de várias AZs dependem de um único NAT Gateway zonal?\u003c/p>", "Resposta": "\u003cp>A falha da AZ do NAT pode interromper a saída dessas subnets.\u003c/p>", "Comentarios": "\u003cp>Este cartão trata da modalidade zonal; conferir modalidades atuais antes de generalizar.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html\" target=\"_blank\" rel=\"noopener noreferrer\">NAT gateway basics - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-006-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Qual trade-off existe ao criar NAT zonal em cada AZ?\u003c/p>", "Resposta": "\u003cp>Aumentar redundância e manter caminhos locais, com mais recursos cobrados.\u003c/p>", "Comentarios": "\u003cp>Comparar requisitos de disponibilidade e padrões de tráfego.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html\" target=\"_blank\" rel=\"noopener noreferrer\">NAT gateway basics - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-007-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Qual recurso permite saída IPv6 para a internet sem permitir conexões iniciadas externamente?\u003c/p>", "Resposta": "\u003cp>Egress-only Internet Gateway.\u003c/p>", "Comentarios": "\u003cp>Seu papel não é o mesmo de um NAT IPv4.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">Enable outbound IPv6 traffic using an egress-only internet gateway - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-007-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>IPv6 elimina a necessidade de security groups?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Endereçamento e autorização de tráfego são preocupações distintas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">Enable outbound IPv6 traffic using an egress-only internet gateway - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-008-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Security groups são stateful ou stateless?\u003c/p>", "Resposta": "\u003cp>Stateful.\u003c/p>", "Comentarios": "\u003cp>Tráfego de resposta a conexões permitidas é tratado conforme o estado mantido.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html\" target=\"_blank\" rel=\"noopener noreferrer\">Ensure internetwork traffic privacy in Amazon VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-008-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>NACLs são stateful ou stateless?\u003c/p>", "Resposta": "\u003cp>Stateless.\u003c/p>", "Comentarios": "\u003cp>É necessário permitir separadamente os fluxos de ida e retorno.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html\" target=\"_blank\" rel=\"noopener noreferrer\">Ensure internetwork traffic privacy in Amazon VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-008-C003", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Qual controle suporta regras explícitas de allow e deny ordenadas por número: SG ou NACL?\u003c/p>", "Resposta": "\u003cp>NACL.\u003c/p>", "Comentarios": "\u003cp>Security groups usam regras de permissão, não uma lista ordenada de negações.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html\" target=\"_blank\" rel=\"noopener noreferrer\">Ensure internetwork traffic privacy in Amazon VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-008-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-009-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Uma NACL permite a porta do serviço na ida, mas bloqueia portas efêmeras no retorno. Qual sintoma pode ocorrer?\u003c/p>", "Resposta": "\u003cp>Falha na conexão ou na resposta.\u003c/p>", "Comentarios": "\u003cp>Uma NACL não libera automaticamente o retorno por conhecer a conexão.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Custom network ACLs for your VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-009-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-009-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Por que as portas efêmeras relevantes variam conforme o cenário?\u003c/p>", "Resposta": "\u003cp>Dependem do cliente e dos componentes no caminho.\u003c/p>", "Comentarios": "\u003cp>Não aplicar um intervalo decorado sem entender o fluxo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Custom network ACLs for your VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-010-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Como permitir que apenas servidores de aplicação de um SG acessem um banco em um cenário suportado?\u003c/p>", "Resposta": "\u003cp>Referenciar o SG da aplicação na regra de entrada do SG do banco.\u003c/p>", "Comentarios": "\u003cp>A referência precisa ser compatível com a topologia e o serviço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html\" target=\"_blank\" rel=\"noopener noreferrer\">Security group rules - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-010-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Referenciar um SG concede permissão IAM para consultar o banco?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Permissão de rede e autorização da aplicação são camadas diferentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html\" target=\"_blank\" rel=\"noopener noreferrer\">Security group rules - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-011-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Quais serviços são atendidos por gateway endpoints tradicionais?\u003c/p>", "Resposta": "\u003cp>Amazon S3 e DynamoDB.\u003c/p>", "Comentarios": "\u003cp>Eles são associados ao roteamento, diferentemente de interface endpoints.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS PrivateLink concepts - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-011-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Como um interface endpoint fornece acesso privado a um serviço suportado?\u003c/p>", "Resposta": "\u003cp>Por interfaces de rede privadas usando AWS PrivateLink.\u003c/p>", "Comentarios": "\u003cp>Há requisitos de DNS, permissões e segurança do endpoint.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS PrivateLink concepts - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-012-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Uma endpoint policy permissiva concede automaticamente acesso a um bucket?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>As políticas de identidade, recurso e demais controles ainda são avaliados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html\" target=\"_blank\" rel=\"noopener noreferrer\">Control access to VPC endpoints using endpoint policies - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-012-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-012-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Para que restringir uma endpoint policy?\u003c/p>", "Resposta": "\u003cp>Para limitar o que pode ser acessado por aquele endpoint.\u003c/p>", "Comentarios": "\u003cp>Ela complementa os outros controles, não os substitui.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html\" target=\"_blank\" rel=\"noopener noreferrer\">Control access to VPC endpoints using endpoint policies - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-012-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-013-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Por que DNS deve ser investigado quando um endpoint privado não é utilizado pela aplicação?\u003c/p>", "Resposta": "\u003cp>O nome consultado pode não estar resolvendo para os endereços privados esperados.\u003c/p>", "Comentarios": "\u003cp>Ter o endpoint criado não garante que todos os clientes resolvam os nomes corretamente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-dns.html\" target=\"_blank\" rel=\"noopener noreferrer\">DNS attributes for your VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-013-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-013-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Qual diferença investigar quando acesso por IP funciona, mas por nome falha?\u003c/p>", "Resposta": "\u003cp>Configuração e resolução DNS.\u003c/p>", "Comentarios": "\u003cp>Isso ajuda a separar falha de resolução de falha de transporte.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-dns.html\" target=\"_blank\" rel=\"noopener noreferrer\">DNS attributes for your VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-013-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-014-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>VPC peering entre A-B e B-C cria automaticamente comunicação A-C?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>VPC peering não oferece roteamento transitivo automático.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is VPC peering? - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-014-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-014-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Criar a conexão de peering basta para o tráfego fluir?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Rotas e controles de rede dos participantes precisam permitir a comunicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is VPC peering? - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-014-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-015-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>VPC Flow Logs capturam o conteúdo completo de cada pacote?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Eles registram informações sobre fluxos de tráfego, úteis para análise de comunicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html\" target=\"_blank\" rel=\"noopener noreferrer\">Logging IP traffic using VPC Flow Logs - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-015-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-015-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Que tipo de evidência um registro REJECT em Flow Logs fornece?\u003c/p>", "Resposta": "\u003cp>Que o fluxo observado foi rejeitado pelos controles reportados.\u003c/p>", "Comentarios": "\u003cp>É necessário analisar contexto e regras para encontrar a causa.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html\" target=\"_blank\" rel=\"noopener noreferrer\">Logging IP traffic using VPC Flow Logs - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-015-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-016-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Qual ferramenta analisa a configuração do caminho entre recursos de rede suportados?\u003c/p>", "Resposta": "\u003cp>VPC Reachability Analyzer.\u003c/p>", "Comentarios": "\u003cp>É análise de alcançabilidade, não um teste completo da lógica da aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Reachability Analyzer? - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-016-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-016-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Um caminho considerado alcançável comprova que o processo HTTP está saudável?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A aplicação pode falhar mesmo com rede configurada corretamente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Reachability Analyzer? - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-016-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-017-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Qual é uma vantagem de Session Manager sobre um bastion exposto com SSH?\u003c/p>", "Resposta": "\u003cp>Pode permitir administração sem abrir portas de entrada para a sessão.\u003c/p>", "Comentarios": "\u003cp>Requer conectividade de saída apropriada e autorização.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Systems Manager Session Manager - AWS Systems Manager\u003c/a>\u003cbr>\u003csmall>SAA-08-017-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-017-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Usar um bastion dispensa limitar acesso administrativo?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O bastion também deve ter acesso restrito, atualização e auditoria.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Systems Manager Session Manager - AWS Systems Manager\u003c/a>\u003cbr>\u003csmall>SAA-08-017-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-018-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Em uma arquitetura web em três camadas, onde normalmente posicionar um banco que só recebe acesso da aplicação?\u003c/p>", "Resposta": "\u003cp>Em subnets privadas com acesso restrito da aplicação.\u003c/p>", "Comentarios": "\u003cp>A entrada pública pode ficar no balanceador.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-example-private-subnets-nat.html\" target=\"_blank\" rel=\"noopener noreferrer\">Example: VPC with servers in private subnets and NAT - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-018-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-018-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Por que colocar aplicação e banco em subnets diferentes não basta para isolá-los?\u003c/p>", "Resposta": "\u003cp>O isolamento depende de rotas e regras de acesso efetivas.\u003c/p>", "Comentarios": "\u003cp>Subnets organizam a rede, mas não definem sozinhas toda a política de segurança.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-example-private-subnets-nat.html\" target=\"_blank\" rel=\"noopener noreferrer\">Example: VPC with servers in private subnets and NAT - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-018-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-019-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Uma aplicação sem internet precisa usar APIs AWS. Qual opção avaliar?\u003c/p>", "Resposta": "\u003cp>VPC endpoints para os serviços necessários e suportados.\u003c/p>", "Comentarios": "\u003cp>Mapear todas as dependências, inclusive logs, imagens e segredos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-access-aws-services.html\" target=\"_blank\" rel=\"noopener noreferrer\">Access AWS services through AWS PrivateLink - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-019-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-019-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Criar apenas um endpoint S3 garante que uma tarefa privada consiga obter imagem do ECR e enviar logs?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Cada dependência precisa do caminho apropriado e das permissões necessárias.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-access-aws-services.html\" target=\"_blank\" rel=\"noopener noreferrer\">Access AWS services through AWS PrivateLink - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-08-019-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-020-C001", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Por que acesso frequente ao S3 por NAT merece revisão de custo?\u003c/p>", "Resposta": "\u003cp>Pode envolver processamento e transferência por componentes evitáveis com uma arquitetura adequada.\u003c/p>", "Comentarios": "\u003cp>Avaliar gateway endpoint e as condições de cobrança aplicáveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://aws.amazon.com/vpc/pricing/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon VPC Pricing\u003c/a>\u003cbr>\u003csmall>SAA-08-020-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-08-020-C002", "modulo": "08", "assunto": "VPC, redes e isolamento", "campos": {"Pergunta": "\u003cp>Deve-se considerar apenas a quantidade de NAT Gateways ao comparar duas redes?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Volume processado, caminhos entre AZs e disponibilidade também importam.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC, redes e isolamento", "Fonte": "\u003ca href=\"https://aws.amazon.com/vpc/pricing/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon VPC Pricing\u003c/a>\u003cbr>\u003csmall>SAA-08-020-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-001-C001", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma EC2 tem rota para IGW, mas não tem IPv4 público. Essa rota basta para acesso IPv4 direto à internet?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O modelo de comunicação pública exige o endereço apropriado além da rota.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">Enable internet access for a VPC using an internet gateway - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-001-C002", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma porta liberada no SG garante acesso público se não existe rota válida?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Roteamento e permissão precisam funcionar em conjunto.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">Enable internet access for a VPC using an internet gateway - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-002-C001", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Instâncias privadas perderam saída após alterar a route table. Qual destino padrão investigar?\u003c/p>", "Resposta": "\u003cp>O caminho para o NAT ou outro mecanismo de saída utilizado.\u003c/p>", "Comentarios": "\u003cp>Confirmar também saúde e conectividade do componente de saída.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-troubleshooting.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot NAT gateways - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-002-C002", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Um NAT público está em subnet sem rota para IGW. Qual parte do fluxo fica comprometida?\u003c/p>", "Resposta": "\u003cp>A saída do NAT para a internet.\u003c/p>", "Comentarios": "\u003cp>A rota da subnet privada até o NAT é só uma etapa do caminho.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-troubleshooting.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot NAT gateways - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-003-C001", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>O ALB marca todos os targets como não saudáveis após mudar a porta da aplicação. O que conferir?\u003c/p>", "Resposta": "\u003cp>Porta do target group, health check e regras de rede.\u003c/p>", "Comentarios": "\u003cp>A aplicação pode estar saudável em uma porta diferente da configurada no balanceador.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-troubleshooting.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot your Application Load Balancers - Elastic Load Balancing\u003c/a>\u003cbr>\u003csmall>SAA-09-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-003-C002", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>O health check recebe código inesperado, mas a rede responde. Qual configuração analisar?\u003c/p>", "Resposta": "\u003cp>Path e códigos aceitos pelo health check.\u003c/p>", "Comentarios": "\u003cp>Uma resposta HTTP existente não é necessariamente uma resposta considerada saudável.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-troubleshooting.html\" target=\"_blank\" rel=\"noopener noreferrer\">Troubleshoot your Application Load Balancers - Elastic Load Balancing\u003c/a>\u003cbr>\u003csmall>SAA-09-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-004-C001", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma aplicação resolve o endpoint RDS, mas a conexão expira. Qual camada investigar antes da senha?\u003c/p>", "Resposta": "\u003cp>Conectividade, rotas e regras de rede.\u003c/p>", "Comentarios": "\u003cp>Erro de autenticação e timeout de transporte indicam problemas diferentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ConnectToInstance.html\" target=\"_blank\" rel=\"noopener noreferrer\">Connecting to your MySQL DB instance - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-09-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-004-C002", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Liberar o banco para 0.0.0.0/0 é a correção adequada para um SG interno mal configurado?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Ajustar a origem e a porta necessárias preserva o isolamento.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ConnectToInstance.html\" target=\"_blank\" rel=\"noopener noreferrer\">Connecting to your MySQL DB instance - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-09-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-005-C001", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma NACL permite entrada TCP 443, mas nega a saída de retorno. Por que o serviço não responde?\u003c/p>", "Resposta": "\u003cp>A NACL é stateless e avalia o retorno separadamente.\u003c/p>", "Comentarios": "\u003cp>É necessário considerar portas de origem e destino em cada direção.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Custom network ACLs for your VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-005-C002", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Em uma NACL, uma regra deny de número menor pode prevalecer sobre allow posterior?\u003c/p>", "Resposta": "\u003cp>Sim.\u003c/p>", "Comentarios": "\u003cp>A avaliação segue a ordem numérica até encontrar correspondência.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Custom network ACLs for your VPC - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-006-C001", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Um interface endpoint existe, mas seu SG não aceita o tráfego do cliente. O DNS privado resolve o problema?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Resolver o endereço não concede transporte pela interface.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/interface-endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">Configure an interface endpoint - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-006-C002", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Clientes continuam usando endereço público de serviço apesar de endpoint privado. O que investigar?\u003c/p>", "Resposta": "\u003cp>DNS privado, resolução do cliente e nome de serviço utilizado.\u003c/p>", "Comentarios": "\u003cp>O endpoint precisa ser efetivamente usado pelo fluxo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/interface-endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">Configure an interface endpoint - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-007-C001", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Há rota de A para B no peering, mas falta rota de retorno. O que pode acontecer?\u003c/p>", "Resposta": "\u003cp>Falha de comunicação bidirecional.\u003c/p>", "Comentarios": "\u003cp>Verificar as route tables de ambos os lados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-routing.html\" target=\"_blank\" rel=\"noopener noreferrer\">Update your route tables for a VPC peering connection - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-007-C002", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma conexão de peering ativa supera automaticamente SGs que bloqueiam a porta?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O peering fornece conectividade potencial; os controles continuam aplicáveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-routing.html\" target=\"_blank\" rel=\"noopener noreferrer\">Update your route tables for a VPC peering connection - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-008-C001", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Recursos em AZs saudáveis perderam saída quando a AZ do único NAT zonal falhou. Qual dependência foi revelada?\u003c/p>", "Resposta": "\u003cp>Uma dependência de saída centralizada naquele NAT zonal.\u003c/p>", "Comentarios": "\u003cp>Espalhar instâncias não remove dependências compartilhadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html\" target=\"_blank\" rel=\"noopener noreferrer\">NAT gateway basics - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-09-008-C002", "modulo": "09", "assunto": "VPC: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Como avaliar uma correção para falha de saída zonal?\u003c/p>", "Resposta": "\u003cp>Selecionar topologia de saída compatível com a disponibilidade requerida.\u003c/p>", "Comentarios": "\u003cp>Comparar redundância, modalidade do NAT e custo do caminho.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "VPC: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html\" target=\"_blank\" rel=\"noopener noreferrer\">NAT gateway basics - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-09-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-001-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Um sistema exige relações complexas e consultas SQL transacionais. Qual família de banco avaliar primeiro?\u003c/p>", "Resposta": "\u003cp>Banco relacional.\u003c/p>", "Comentarios": "\u003cp>O requisito de consulta e integridade pesa mais que popularidade do serviço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/database.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Database category iconDatabases - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-10-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-001-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Uma aplicação tem consultas previsíveis por chave e grande necessidade de escala. Qual opção AWS considerar?\u003c/p>", "Resposta": "\u003cp>DynamoDB, se seu modelo atender aos padrões de acesso.\u003c/p>", "Comentarios": "\u003cp>NoSQL não significa ausência de modelagem; a chave é parte central do desenho.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/database.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Database category iconDatabases - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-10-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-002-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual atividade RDS reduz em comparação a instalar um banco diretamente em EC2?\u003c/p>", "Resposta": "\u003cp>Administração de infraestrutura e tarefas gerenciadas do banco, conforme os recursos utilizados.\u003c/p>", "Comentarios": "\u003cp>O cliente ainda projeta esquema, consultas, permissões e configuração.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Relational Database Service (Amazon RDS)? - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-002-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>RDS permite administrar livremente o sistema operacional subjacente como em EC2?\u003c/p>", "Resposta": "\u003cp>Não no modelo gerenciado padrão.\u003c/p>", "Comentarios": "\u003cp>Requisitos de acesso ao host podem mudar a escolha de serviço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Relational Database Service (Amazon RDS)? - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-003-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>A standby de um RDS Multi-AZ DB instance tradicional atende consultas de leitura?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Sua finalidade é disponibilidade e failover; não confundir com read replica.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-AZ DB instance deployments for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-003-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual é o objetivo principal de Multi-AZ DB instance com uma standby?\u003c/p>", "Resposta": "\u003cp>Reduzir indisponibilidade por falha da instância ou AZ conforme o mecanismo de failover.\u003c/p>", "Comentarios": "\u003cp>Isso não significa executar mais consultas de leitura na standby.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-AZ DB instance deployments for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-004-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Um RDS Multi-AZ DB cluster tem o mesmo comportamento de leitura da standby tradicional de DB instance?\u003c/p>", "Resposta": "\u003cp>Não. O cluster possui instâncias leitoras utilizáveis.\u003c/p>", "Comentarios": "\u003cp>Sempre identificar a modalidade antes de responder sobre leitura em Multi-AZ.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-AZ DB cluster deployments for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-004-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Por que a frase toda implantação RDS Multi-AZ não atende leituras nas secundárias é incorreta?\u003c/p>", "Resposta": "\u003cp>Porque generaliza o modelo tradicional para modalidades diferentes.\u003c/p>", "Comentarios": "\u003cp>RDS Multi-AZ DB cluster e Aurora têm arquiteturas próprias.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-AZ DB cluster deployments for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-005-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual recurso RDS pode reduzir carga de leitura no banco de origem?\u003c/p>", "Resposta": "\u003cp>Read replicas.\u003c/p>", "Comentarios": "\u003cp>A aplicação precisa direcionar leituras aos endpoints apropriados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with DB instance read replicas - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-005-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual risco de consistência avaliar ao ler de uma read replica com replicação assíncrona?\u003c/p>", "Resposta": "\u003cp>Replication lag.\u003c/p>", "Comentarios": "\u003cp>Uma gravação recente pode ainda não estar visível na réplica.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with DB instance read replicas - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-005-C003", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Promover uma read replica é equivalente a continuar mantendo-a como réplica do mesmo primário?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A promoção muda seu papel; planejar a aplicação e a continuidade da replicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with DB instance read replicas - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-005-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-006-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>O que permite recuperar um banco a um instante dentro da janela suportada de backups automáticos?\u003c/p>", "Resposta": "\u003cp>Point-in-time recovery.\u003c/p>", "Comentarios": "\u003cp>A recuperação cria uma instância conforme o fluxo de restauração, não desfaz consultas no banco atual.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html\" target=\"_blank\" rel=\"noopener noreferrer\">Introduction to backups - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-006-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Um snapshot manual substitui automaticamente uma janela contínua de recuperação ponto a ponto?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Ele representa um ponto específico de proteção.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html\" target=\"_blank\" rel=\"noopener noreferrer\">Introduction to backups - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-007-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>CPU baixa com alta espera de disco sugere investigar qual dimensão do RDS?\u003c/p>", "Resposta": "\u003cp>IOPS, throughput e latência de armazenamento.\u003c/p>", "Comentarios": "\u003cp>Aumentar CPU pode não resolver um gargalo de I/O.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon RDS DB instance storage - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-007-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Auto scaling de storage RDS deve ser confundido com redução automática de tamanho quando o uso cai?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Capacidade de expansão não implica redução automática.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon RDS DB instance storage - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-008-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual recurso pode reduzir pressão de muitas conexões curtas de funções serverless ao banco?\u003c/p>", "Resposta": "\u003cp>RDS Proxy.\u003c/p>", "Comentarios": "\u003cp>O pooling ajuda a gerenciar conexões sem transformar o banco em capacidade infinita.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon RDS Proxy - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-008-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>RDS Proxy elimina a necessidade de otimizar consultas lentas?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Pooling de conexões e desempenho das consultas são problemas distintos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon RDS Proxy - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-009-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>No Aurora, computação e armazenamento formam necessariamente um disco local único de uma instância?\u003c/p>", "Resposta": "\u003cp>Não. A arquitetura separa instâncias e armazenamento de cluster distribuído.\u003c/p>", "Comentarios": "\u003cp>Essa separação é importante para compreender réplicas e recuperação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Aurora DB clusters - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-009-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-009-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Por que não descrever Aurora simplesmente como um RDS comum com uma standby tradicional?\u003c/p>", "Resposta": "\u003cp>Seu armazenamento, endpoints e réplicas seguem arquitetura específica.\u003c/p>", "Comentarios": "\u003cp>A modalidade do serviço muda a resposta correta em cenários.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Aurora DB clusters - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-010-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual endpoint Aurora aponta para a instância primária para operações de escrita?\u003c/p>", "Resposta": "\u003cp>O cluster endpoint, também chamado writer endpoint.\u003c/p>", "Comentarios": "\u003cp>A aplicação evita fixar o endereço de uma instância que pode mudar de papel.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Aurora endpoint connections - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-010-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual finalidade do reader endpoint do Aurora?\u003c/p>", "Resposta": "\u003cp>Distribuir conexões de leitura entre réplicas apropriadas.\u003c/p>", "Comentarios": "\u003cp>Distribuição de conexões não significa balanceamento de cada consulta dentro de uma conexão.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Aurora endpoint connections - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-011-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual papel uma Aurora Replica pode desempenhar além de atender leituras?\u003c/p>", "Resposta": "\u003cp>Ser candidata à promoção em um failover.\u003c/p>", "Comentarios": "\u003cp>Planejar prioridade e capacidade para suportar a função de writer.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html\" target=\"_blank\" rel=\"noopener noreferrer\">Replication with Amazon Aurora - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-011-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Uma aplicação que usa endereço fixo da instância evita todos os problemas de failover?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>É necessário usar endpoints apropriados e tratar reconexão.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html\" target=\"_blank\" rel=\"noopener noreferrer\">Replication with Amazon Aurora - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-012-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual recurso Aurora foi desenhado para bancos distribuídos em múltiplas regiões com recuperação regional?\u003c/p>", "Resposta": "\u003cp>Aurora Global Database.\u003c/p>", "Comentarios": "\u003cp>É necessário entender o fluxo de replicação e os papéis regionais.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using Amazon Aurora Global Database - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-012-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-012-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Aurora Global Database significa aceitar escrita independente em qualquer região sem considerar configuração e modo?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O caminho de escrita e recursos como encaminhamento devem ser avaliados explicitamente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using Amazon Aurora Global Database - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-012-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-013-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual característica central do Aurora Serverless v2 atende demanda variável?\u003c/p>", "Resposta": "\u003cp>Ajuste de capacidade de computação dentro da configuração suportada.\u003c/p>", "Comentarios": "\u003cp>Não confundir escalabilidade com eliminação de todos os custos ou limites.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using Aurora serverless - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-013-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-013-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Aurora Serverless v2 dispensa planejamento de conexões e consultas?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A aplicação ainda pode atingir limites ou usar o banco de forma ineficiente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using Aurora serverless - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-013-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-014-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Ao comparar Aurora provisionado e Serverless v2, quais aspectos de demanda importam?\u003c/p>", "Resposta": "\u003cp>Estabilidade, amplitude dos picos e capacidade mínima necessária.\u003c/p>", "Comentarios": "\u003cp>A opção mais barata depende do uso real e da configuração.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html\" target=\"_blank\" rel=\"noopener noreferrer\">How Aurora serverless works - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-014-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-014-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>É correto afirmar que qualquer Aurora Serverless sempre escala a zero?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Suporte, versão e configuração precisam ser conferidos; não generalizar entre modalidades.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html\" target=\"_blank\" rel=\"noopener noreferrer\">How Aurora serverless works - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-10-014-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-015-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Quando um cache pode reduzir latência de consultas ao banco?\u003c/p>", "Resposta": "\u003cp>Quando resultados reutilizáveis podem ser atendidos em memória.\u003c/p>", "Comentarios": "\u003cp>Definir validade e atualização para não servir dados além da tolerância.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon ElastiCache? - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-10-015-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-015-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Cache elimina a necessidade de um banco persistente em todo cenário?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O papel de armazenamento durável depende da arquitetura e do produto escolhido.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon ElastiCache? - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-10-015-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-016-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>No padrão cache-aside, o que ocorre após um cache miss?\u003c/p>", "Resposta": "\u003cp>A aplicação consulta a origem e pode preencher o cache.\u003c/p>", "Comentarios": "\u003cp>A estratégia demanda controle de expiração e invalidação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html\" target=\"_blank\" rel=\"noopener noreferrer\">Caching strategies for Memcached - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-10-016-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-016-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual diferença de write-through em relação a preencher cache apenas após leitura?\u003c/p>", "Resposta": "\u003cp>A atualização do cache acompanha a escrita no fluxo projetado.\u003c/p>", "Comentarios": "\u003cp>O objetivo é reduzir misses futuros, com custo adicional no caminho de atualização.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html\" target=\"_blank\" rel=\"noopener noreferrer\">Caching strategies for Memcached - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-10-016-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-017-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual trade-off existe ao aumentar TTL de dados em cache?\u003c/p>", "Resposta": "\u003cp>Mais reutilização, com maior risco de servir dados desatualizados.\u003c/p>", "Comentarios": "\u003cp>A tolerância de negócio define a validade aceitável.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/database-caching-strategies-using-redis/cache-validity.html\" target=\"_blank\" rel=\"noopener noreferrer\">Cache Validity - Database Caching Strategies Using Redis\u003c/a>\u003cbr>\u003csmall>SAA-10-017-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-017-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>O que é cache stampede?\u003c/p>", "Resposta": "\u003cp>Muitos clientes recomputarem ou consultarem a origem ao mesmo tempo após expiração ou miss.\u003c/p>", "Comentarios": "\u003cp>Jitter, coordenação e estratégias de atualização podem reduzir o pico.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/database-caching-strategies-using-redis/cache-validity.html\" target=\"_blank\" rel=\"noopener noreferrer\">Cache Validity - Database Caching Strategies Using Redis\u003c/a>\u003cbr>\u003csmall>SAA-10-017-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-018-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Por que a escolha entre motores de cache precisa considerar mais que velocidade?\u003c/p>", "Resposta": "\u003cp>Estruturas de dados, replicação, persistência e operação diferem.\u003c/p>", "Comentarios": "\u003cp>Selecionar o motor a partir das capacidades exigidas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/SelectEngine.html\" target=\"_blank\" rel=\"noopener noreferrer\">Comparing node-based Valkey, Memcached, and Redis OSS clusters - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-10-018-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-018-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Uma aplicação precisa de estruturas como conjuntos ordenados. O tipo de dado influencia a escolha do cache?\u003c/p>", "Resposta": "\u003cp>Sim.\u003c/p>", "Comentarios": "\u003cp>Um cache simples chave-valor pode não oferecer as operações necessárias.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/SelectEngine.html\" target=\"_blank\" rel=\"noopener noreferrer\">Comparing node-based Valkey, Memcached, and Redis OSS clusters - Amazon ElastiCache\u003c/a>\u003cbr>\u003csmall>SAA-10-018-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-019-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual banco AWS avaliar para relações e consultas em grafos?\u003c/p>", "Resposta": "\u003cp>Amazon Neptune.\u003c/p>", "Comentarios": "\u003cp>O modelo é útil quando conexões entre entidades são centrais.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/neptune/latest/userguide/intro.html\" target=\"_blank\" rel=\"noopener noreferrer\">What Is Amazon Neptune? - Amazon Neptune\u003c/a>\u003cbr>\u003csmall>SAA-10-019-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-019-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual serviço AWS é voltado a banco de documentos com compatibilidade de APIs MongoDB suportadas?\u003c/p>", "Resposta": "\u003cp>Amazon DocumentDB.\u003c/p>", "Comentarios": "\u003cp>Compatibilidade deve ser verificada para recursos e versões da aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon DocumentDB (with MongoDB compatibility) - Amazon DocumentDB\u003c/a>\u003cbr>\u003csmall>SAA-10-019-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-019-C003", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Qual serviço gerenciado atende workloads compatíveis com Apache Cassandra?\u003c/p>", "Resposta": "\u003cp>Amazon Keyspaces.\u003c/p>", "Comentarios": "\u003cp>O foco é o modelo e a interface Cassandra suportada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/keyspaces/latest/devguide/what-is-keyspaces.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Keyspaces (for Apache Cassandra)? - Amazon Keyspaces (for Apache Cassandra)\u003c/a>\u003cbr>\u003csmall>SAA-10-019-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-020-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>IAM database authentication concede automaticamente autorização para todas as tabelas do banco?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Autenticação no banco e privilégios internos de consulta são controles diferentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM database authentication for MariaDB, MySQL, and PostgreSQL - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-020-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-020-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Por que manter RDS privado quando só a aplicação precisa acessá-lo?\u003c/p>", "Resposta": "\u003cp>Para limitar a superfície de exposição de rede.\u003c/p>", "Comentarios": "\u003cp>Ainda é necessário configurar SGs, autenticação e permissões no banco.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html\" target=\"_blank\" rel=\"noopener noreferrer\">IAM database authentication for MariaDB, MySQL, and PostgreSQL - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-10-020-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-021-C001", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Por que réplicas ociosas e backups retidos precisam entrar na análise de custo?\u003c/p>", "Resposta": "\u003cp>Eles podem gerar cobrança mesmo sem aumentar o uso útil da aplicação.\u003c/p>", "Comentarios": "\u003cp>O custo total inclui mais que a instância primária.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://aws.amazon.com/rds/pricing/\" target=\"_blank\" rel=\"noopener noreferrer\">Managed Relational Database - Amazon RDS Pricing - Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-10-021-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-10-021-C002", "modulo": "10", "assunto": "Bancos relacionais, cache e bancos especializados", "campos": {"Pergunta": "\u003cp>Uma mudança de engine pode reduzir custo sem qualquer análise funcional?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Compatibilidade, licenciamento, migração e desempenho devem ser avaliados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Bancos relacionais, cache e bancos especializados", "Fonte": "\u003ca href=\"https://aws.amazon.com/rds/pricing/\" target=\"_blank\" rel=\"noopener noreferrer\">Managed Relational Database - Amazon RDS Pricing - Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-10-021-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-001-C001", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma aplicação perde conexões durante failover RDS. Qual comportamento ela deve implementar?\u003c/p>", "Resposta": "\u003cp>Reconectar e tratar falhas transitórias apropriadamente.\u003c/p>", "Comentarios": "\u003cp>Alta disponibilidade do serviço não torna toda conexão cliente indestrutível.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.Failover.html\" target=\"_blank\" rel=\"noopener noreferrer\">Failing over a Multi-AZ DB instance for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-001-C002", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>É seguro fixar permanentemente o IP resolvido do endpoint RDS?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Mudanças de infraestrutura e failover podem alterar o destino.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.Failover.html\" target=\"_blank\" rel=\"noopener noreferrer\">Failing over a Multi-AZ DB instance for Amazon RDS - Amazon Relational Database Ser
