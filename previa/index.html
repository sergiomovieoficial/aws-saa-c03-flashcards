vice\u003c/a>\u003cbr>\u003csmall>SAA-11-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-002-C001", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Aumentou a carga de consultas de leitura. Uma standby tradicional Multi-AZ resolve diretamente a distribuição dessas consultas?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Avaliar read replicas e cache conforme consistência e padrão de acesso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with DB instance read replicas - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-002-C002", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma consulta na réplica não vê uma gravação recente. Qual hipótese investigar?\u003c/p>", "Resposta": "\u003cp>Atraso da replicação.\u003c/p>", "Comentarios": "\u003cp>Direcionar leituras sensíveis à consistência ao destino apropriado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\" target=\"_blank\" rel=\"noopener noreferrer\">Working with DB instance read replicas - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-003-C001", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Milhares de funções abrem conexões curtas ao banco. Qual recurso pode reduzir essa pressão?\u003c/p>", "Resposta": "\u003cp>RDS Proxy.\u003c/p>", "Comentarios": "\u003cp>Ainda dimensionar rios e diagnóstico", "campos": {"Pergunta": "\u003cp>Após restaurar um snapshot, basta presumir que toda configuração operacional está idêntica?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Verificar grupos de parâmetros, rede, segurança e opções aplicáveis.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_RestoreFromSnapshot.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restoring to a DB instance - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-005-C001", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>É possível escolher qualquer data histórica para PITR independentemente da retenção?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O instante precisa estar dentro da janela recuperável disponível.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restoring a DB instance to a specified time for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-005-C002", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>PITR e read replica resolvem o mesmo problema?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>PITR recupera um estado anterior; réplica atende replicação e outros objetivos conforme o desenho.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html\" target=\"_blank\" rel=\"noopener noreferrer\">Restoring a DB instance to a specified time for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-006-C001", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Ao compartilhar snapshot criptografado, qual dependência precisa de análise além do snapshot?\u003c/p>", "Resposta": "\u003cp>A chave KMS e suas permissões.\u003c/p>", "Comentarios": "\u003cp>Existem restrições conforme o tipo de chave e o procedimento de compartilhamento.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ShareSnapshot.html\" target=\"_blank\" rel=\"noopener noreferrer\">Sharing a DB snapshot for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-006-C002", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Por que uma cópia cifrada por chave própria pode fazer parte do fluxo de compartilhamento?\u003c/p>", "Resposta": "\u003cp>Para viabilizar controle de autorização adequado à conta destinatária.\u003c/p>", "Comentarios": "\u003cp>Verificar o procedimento suportado antes de compartilhar.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ShareSnapshot.html\" target=\"_blank\" rel=\"noopener noreferrer\">Sharing a DB snapshot for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-007-C001", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Leituras destinadas às réplicas continuam chegando ao writer. O que verificar na aplicação?\u003c/p>", "Resposta": "\u003cp>O endpoint e a separação de conexões de leitura e escrita.\u003c/p>", "Comentarios": "\u003cp>Criar réplicas não altera automaticamente strings de conexão.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Aurora endpoint connections - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-11-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-007-C002", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>O reader endpoint deve ser usado indiscriminadamente para transações de escrita?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O acesso deve usar o endpoint compatível com a operação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Aurora endpoint connections - Amazon Aurora\u003c/a>\u003cbr>\u003csmall>SAA-11-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-008-C001", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>CPU normal e aumento de latência de armazenamento indicam investigar qual recurso?\u003c/p>", "Resposta": "\u003cp>I/O do banco.\u003c/p>", "Comentarios": "\u003cp>Usar métricas de espera, throughput e IOPS para confirmar.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MonitoringOverview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Monitoring tools for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-11-008-C002", "modulo": "11", "assunto": "RDS: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Muitas conexões ociosas podem consumir recursos mesmo com poucas consultas?\u003c/p>", "Resposta": "\u003cp>Sim.\u003c/p>", "Comentarios": "\u003cp>Gerenciar pools e limites de conexões ajuda a evitar desperdício.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "RDS: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MonitoringOverview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Monitoring tools for Amazon RDS - Amazon Relational Database Service\u003c/a>\u003cbr>\u003csmall>SAA-11-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-12-001-C001", "modulo": "12", "assunto": "DynamoDB e modelagem por acesso", "campos": {"Pergunta": "\u003cp>Qual é a função da partition key no DynamoDB?\u003c/p>", "Resposta": "\u003cp>Participar da identificação e distribuição dos itens.\u003c/p>", "Comentarios": "\u003cp>Uma boa escolha distribui a carga conforme os padrões de acesso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "DynamoDB e modelagem por acesso", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.CoreComponents.html\" target=\"_blank\" rel=\"noopener noreferrer\">Core components of Amazon DynamoDB - Amazon DynamoDB\u003c/a>\u003cbr>\u003csmall>SAA-12-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-12-001-C002", "modulo": "12", "assunto": "DynamoDB e modelagem por acesso", "campos": {"Pergunta": "\u003cp>Em uma chave composta, para que serve a sort key?\u003c/p>", "Resposta": "\u003cp>Distinguir e ordenar itens com a mesma partition key.\u unto": "DynamoDB e modelagem por acesso", "campos": {"Pergunta": "\u003cp>Qual tipo de dado combina com TTL?\u003c/p>", "Resposta": "\u003cp>Itens temporários cuja expiração pode ser gerenciada pelo serviço.\u003c/p>", "Comentarios": "\u003cp>Considerar o comportamento enquanto o item expirado ainda não foi removido.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "DynamoDB e modelagem por acesso", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using time to live (TTL) in DynamoDB - Amazon DynamoDB\u003c/a>\u003cbr>\u003csmall>SAA-12-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-12-011-C001", "modulo": "12", "assunto": "DynamoDB e modelagem por acesso", "campos": {"Pergunta": "\u003cp>Para que usar transações DynamoDB?\u003c/p>", "Resposta": "\u003cp>Coordenar um conjunto de operações com garantias transacionais suportadas.\u003c/p>", "Comentarios": "\u003cp>Elas têm limites e consumo próprios.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "DynamoDB e modelagem por acesso", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon DynamoDB Transactions: How it works - Amazon DynamoDB\u003c/a>\u003cbr>\u003csmall>SAA-12-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-12-011-C002", "modulo": "12", "assunto": "DynamoDB e modelagem por acesso", "campos": {"Pergunta": "\u003cp>Como evitar sobrescrever um item sem verificar sua versão ou estado esperado?\u003c/p>", "Resposta": "\u003cp>Usar escrita condicional adequada.\u003c/p>", "Comentarios": "\u003cp>A condição é avaliada como parte da operação, evitando uma checagem separada sujeita à corrida.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "DynamoDB e modelagem por acesso", "Fonte": "\u003ca href=\"https://docs eder acesso controlado a um conteúdo ou URL específico.\u003c/p>", "Comentarios": "\u003cp>A política e a validade delimitam o uso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Route 53, CloudFront e entrega global", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html\" target=\"_blank\" rel=\"noopener noreferrer\">Use signed URLs - Amazon CloudFront\u003c/a>\u003cbr>\u003csmall>SAA-13-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-13-011-C002", "modulo": "13", "assunto": "Route 53, CloudFront e entrega global", "campos": {"Pergunta": "\u003cp>Quando signed cookies podem ser mais convenientes que assinar cada URL?\u003c/p>", "Resposta": "\u003cp>Quando o usuário precisa acessar vários arquivos restritos.\u003c/p>", "Comentarios": "\u003cp>O mecanismo pode autorizar um conjunto de recursos sem modificar cada link.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Route 53, CloudFront e entrega global", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html\" target=\"_blank\" rel=\"noopener noreferrer\">Use signed cookies - Amazon CloudFront\u003c/a>\u003cbr>\u003csmall>SAA-13-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-13-012-C001", "modulo": "13", "assunto": "Route 53, CloudFront e entrega global", "campos": {"Pergunta": "\u003cp>Em qual região um certificado ACM usado entre viewers e CloudFront deve ser solicitado ou importado?\u003c/p>", "Resposta": "\u003cp>US East (N. Virginia), us-east-1.\u003c/p>", "Comentarios": "\u003cp>Essa exigência refere-se ao certificado para o lado do viewer.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Route 53, CloudFront e entrega global", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html\" target=\"_blan cp>CloudFront origin failover replica automaticamente os dados entre as origens?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A consistência e disponibilidade do conteúdo secundário devem ser preparadas separadamente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Route 53, CloudFront e entrega global", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html\" target=\"_blank\" rel=\"noopener noreferrer\">Optimize high availability with CloudFront origin failover - Amazon CloudFront\u003c/a>\u003cbr>\u003csmall>SAA-13-013-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-13-014-C001", "modulo": "13", "assunto": "Route 53, CloudFront e entrega global", "campos": {"Pergunta": "\u003cp>Qual diferença central entre CloudFront e Global Accelerator?\u003c/p>", "Resposta": "\u003cp>CloudFront é uma CDN com cache; Global Accelerator otimiza encaminhamento global para endpoints de aplicações.\u003c/p>", "Comentarios": "\u003cp>Escolher por protocolo, cache e requisitos de endereço.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Route 53, CloudFront e entrega global", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Global Accelerator? - AWS Global Accelerator\u003c/a>\u003cbr>\u003csmall>SAA-13-014-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-13-014-C002", "modulo": "13", "assunto": "Route 53, CloudFront e entrega global", "campos": {"Pergunta": "\u003cp>Uma aplicação TCP global precisa de IPs estáticos e não de cache HTTP. Qual serviço avaliar?\u003c/p>", "Resposta": "\u003cp>AWS Global Accelerator.\u003c/p>", "Comentarios": "\u003cp>Validar os tipos de endpoint e o protocolo da aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Route 53, CloudFront C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-14-002-C001", "modulo": "14", "assunto": "Mensageria, eventos e orquestração", "campos": {"Pergunta": "\u003cp>Qual semântica de entrega deve ser considerada em SQS Standard?\u003c/p>", "Resposta": "\u003cp>Pelo menos uma vez, com possibilidade de duplicação e ordem não estrita.\u003c/p>", "Comentarios": "\u003cp>O consumidor deve tolerar reentregas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Mensageria, eventos e orquestração", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SQS standard queues - Amazon Simple Queue Service\u003c/a>\u003cbr>\u003csmall>SAA-14-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-14-002-C002", "modulo": "14", "assunto": "Mensageria, eventos e orquestração", "campos": {"Pergunta": "\u003cp>Em SQS FIFO, a ordenação relevante é global entre todos os grupos de mensagem?\u003c/p>", "Resposta": "\u003cp>Não. A ordem é mantida dentro de cada message group.\u003c/p>", "Comentarios": "\u003cp>Grupos distintos permitem concorrência conforme o recurso.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Mensageria, eventos e orquestração", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html\" target=\"_blank\" rel=\"noopener noreferrer\">FIFO queue delivery logic in Amazon SQS - Amazon Simple Queue Service\u003c/a>\u003cbr>\u003csmall>SAA-14-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-14-002-C003", "modulo": "14", "assunto": "Mensageria, eventos e orquestração", "campos": {"Pergunta": "\u003cp>FIFO dispensa idempotência de efeitos de negócio em qualquer falha do consumidor?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Falhar depois do efeito e antes da c os e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html\" target=\"_blank\" rel=\"noopener noreferrer\">Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing - Amazon Simple Notification Service\u003c/a>\u003cbr>\u003csmall>SAA-15-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-15-006-C001", "modulo": "15", "assunto": "Mensageria: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Mensagens de grupos diferentes em FIFO avançam em paralelo. Isso viola ordenação por grupo?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>A ordenação é avaliada dentro do grupo correspondente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Mensageria: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html\" target=\"_blank\" rel=\"noopener noreferrer\">FIFO queue delivery logic in Amazon SQS - Amazon Simple Queue Service\u003c/a>\u003cbr>\u003csmall>SAA-15-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-15-006-C002", "modulo": "15", "assunto": "Mensageria: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Uma única chave de grupo é adequada quando eventos independentes precisam de alto paralelismo?\u003c/p>", "Resposta": "\u003cp>Pode limitar a concorrência desnecessariamente.\u003c/p>", "Comentarios": "\u003cp>Separar grupos conforme a unidade que realmente exige ordem.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Mensageria: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html\" target=\"_blank\" rel=\"noopener noreferrer\">FIFO queue delivery logic in Amazon SQS - Amazon Simple Queue Service\u003c/a>\u003cbr>\u003csmall>SAA-15-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-15-007-C001", "modulo": "15", "assunto": "Mensageria: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Um replay usa novo ID de transporte para o mesmo pagamento. Qual ID deve orientar deduplicação de negócio?\u003c/p>", "Resposta": "\u003cp>Um identificador estável da operação de pagamento.\u003c/p>", "Comentarios": "\u003cp>IDs de entrega e IDs de negócio não são necessariamente equivalentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Mensageria: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_prevent_interaction_failure_idempotent.html\" target=\"_blank\" rel=\"noopener noreferrer\">REL04-BP04 Make mutating operations idempotent - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-15-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-15-007-C002", "modulo": "15", "assunto": "Mensageria: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Guardar apenas uma marca em memória local garante deduplicação após substituir o consumidor?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O registro pode desaparecer com a instância; a proteção precisa sobreviver conforme o requisito.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Mensageria: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_prevent_interaction_failure_idempotent.html\" target=\"_blank\" rel=\"noopener noreferrer\">REL04-BP04 Make mutating operations idempotent - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-15-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-15-008-C001", "modulo": "15", "assunto": "Mensageria: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Como reduzir reprocessamento de itens bem-sucedidos quando parte de um lote SQS-Lambda falha?\u003c/p>", "Resposta": "\u003cp>Configurar e implementar partial batch responses compatíveis.\u003c/p>", "Comentarios": "\u003cp>A função precisa reportar corretamente os itens malsucedidos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Mensageria: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html\" target=\"_blank\" rel=\"noopener noreferrer\">Handling errors for an SQS event source in Lambda - AWS Lambda\u003c/a>\u003cbr>\u003csmall>SAA-15-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-15-008-C002", "modulo": "15", "assunto": "Mensageria: laboratórios e diagnóstico", "campos": {"Pergunta": "\u003cp>Retornar sucesso geral quando um item não foi processado é uma forma segura de tratar falha parcial?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Pode confirmar indevidamente trabalho que deveria ser repetido.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Mensageria: laboratórios e diagnóstico", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html\" target=\"_blank\" rel=\"noopener noreferrer\">Handling errors for an SQS event source in Lambda - AWS Lambda\u003c/a>\u003cbr>\u003csmall>SAA-15-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-001-C001", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Qual diferença central de escolha existe entre ECS e EKS?\u003c/p>", "Resposta": "\u003cp>ECS é a orquestração própria da AWS; EKS oferece Kubernetes gerenciado.\u003c/p>", "Comentarios": "\u003cp>Compatibilidade com Kubernetes pode ser um requisito decisivo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/containers.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Containers category iconContainers - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-16-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-001-C002", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Usar EKS significa que toda operação da aplicação e dos nós desaparece?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>As responsabilidades variam conforme a modalidade de execução e a configuração.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-overview/containers.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Containers category iconContainers - Overview of Amazon Web Services\u003c/a>\u003cbr>\u003csmall>SAA-16-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-002-C001", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Qual opção executa tarefas ECS sem administrar diretamente uma frota EC2?\u003c/p>", "Resposta": "\u003cp>AWS Fargate.\u003c/p>", "Comentarios": "\u003cp>A equipe continua definindo recursos, imagens, rede e permissões da tarefa.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html\" target=\"_blank\" rel=\"noopener noreferrer\">Architect for AWS Fargate for Amazon ECS - Amazon Elastic Container Service\u003c/a>\u003cbr>\u003csmall>SAA-16-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-002-C002", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Quando EC2 para containers pode ser preferível a Fargate?\u003c/p>", "Resposta": "\u003cp>Quando controle do host, compatibilidade ou economia de utilização justificam a operação.\u003c/p>", "Comentarios": "\u003cp>A decisão precisa considerar requisitos suportados e custo total.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html\" target=\"_blank\" rel=\"noopener noreferrer\">Architect for AWS Fargate for Amazon ECS - Amazon Elastic Container Service\u003c/a>\u003cbr>\u003csmall>SAA-16-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-003-C001", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Qual diferença entre task definition e task no ECS?\u003c/p>", "Resposta": "\u003cp>A definição descreve a execução; a task é uma instância dessa definição em execução.\u003c/p>", "Comentarios": "\u003cp>Uma service administra a manutenção de tarefas conforme a configuração.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Elastic Container Service? - Amazon Elastic Container Service\u003c/a>\u003cbr>\u003csmall>SAA-16-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-003-C002", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Qual componente ECS mantém o número desejado de tarefas de uma aplicação contínua?\u003c/p>", "Resposta": "\u003cp>ECS service.\u003c/p>", "Comentarios": "\u003cp>Uma tarefa avulsa não tem necessariamente o mesmo gerenciamento de ciclo de vida.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is Amazon Elastic Container Service? - Amazon Elastic Container Service\u003c/a>\u003cbr>\u003csmall>SAA-16-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-004-C001", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Qual role ECS é usada pelo agente para atividades como obter imagens e enviar logs, conforme o ambiente?\u003c/p>", "Resposta": "\u003cp>Task execution role.\u003c/p>", "Comentarios": "\u003cp>Não é a role que deve conceder indiscriminadamente acesso de negócio ao código.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon ECS task execution IAM role - Amazon Elastic Container Service\u003c/a>\u003cbr>\u003csmall>SAA-16-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-004-C002", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Qual role deve autorizar o código do container a ler uma tabela DynamoDB?\u003c/p>", "Resposta": "\u003cp>Task role.\u003c/p>", "Comentarios": "\u003cp>Separar permissões de execução da plataforma das permissões da aplicação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon ECS task IAM role - Amazon Elastic Container Service\u003c/a>\u003cbr>\u003csmall>SAA-16-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-005-C001", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Qual característica do modo awsvpc permite controle de rede no nível da tarefa?\u003c/p>", "Resposta": "\u003cp>A tarefa utiliza uma interface de rede com configuração própria apropriada.\u003c/p>", "Comentarios": "\u003cp>Planejar endereços de subnet e security groups.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-networking-awsvpc.html\" target=\"_blank\" rel=\"noopener noreferrer\">Allocate a network interface for an Amazon ECS task - Amazon Elastic Container Service\u003c/a>\u003cbr>\u003csmall>SAA-16-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-005-C002", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>Uma tarefa em subnet privada consegue buscar imagem sem qualquer caminho para ECR ou internet?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Ela precisa alcançar as dependências necessárias por endpoints ou saída adequada.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-networking-awsvpc.html\" target=\"_blank\" rel=\"noopener noreferrer\">Allocate a network interface for an Amazon ECS task - Amazon Elastic Container Service\u003c/a>\u003cbr>\u003csmall>SAA-16-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-16-006-C001", "modulo": "16", "assunto": "Containers e execução gerenciada", "campos": {"Pergunta": "\u003cp>O que ECS Service Auto Scaling ajusta?\u003c/p>", "Resposta": "\u003cp>A quantidade desejada de tarefas de uma service.\u003c/p>", "Comentarios": "\u003cp>Capacidade para executar essas tarefas também precisa estar disponível.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Containers e execução gerenciada", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-auto-scaling.html\" target=\"_blank\" rel=\"noopener noreferrer\"  métrica CloudWatch?\u003c/p>", "Resposta": "\u003cp>Identificar características da série, como o recurso monitorado.\u003c/p>", "Comentarios": "\u003cp>Misturar séries pode ocultar o comportamento de uma instância específica.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Observabilidade, auditoria e operação", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Metrics concepts - Amazon CloudWatch\u003c/a>\u003cbr>\u003csmall>SAA-20-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-20-002-C002", "modulo": "20", "assunto": "Observabilidade, auditoria e operação", "campos": {"Pergunta": "\u003cp>Por que a média de latência não descreve sozinha a experiência dos usuários?\u003c/p>", "Resposta": "\u003cp>Ela pode esconder a cauda de requisições lentas.\u003c/p>", "Comentarios": "\u003cp>Percentis e distribuição ajudam a entender o problema.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Observabilidade, auditoria e operação", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Metrics concepts - Amazon CloudWatch\u003c/a>\u003cbr>\u003csmall>SAA-20-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-20-003-C001", "modulo": "20", "assunto": "Observabilidade, auditoria e operação", "campos": {"Pergunta": "\u003cp>Qual objetivo de um alarme CloudWatch?\u003c/p>", "Resposta": "\u003cp>Avaliar uma condição de métrica e realizar ações configuradas ao mudar de estado.\u003c/p>", "Comentarios": "\u003cp>Métrica sem resposta operacional não garante reação ao incidente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Observabilidade, auditoria e operação", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html\" posta": "\u003cp>Organization trail.\u003c/p>", "Comentarios": "\u003cp>Permissões e armazenamento central precisam ser protegidos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Observabilidade, auditoria e operação", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html\" target=\"_blank\" rel=\"noopener noreferrer\">Creating a trail for an organization - AWS CloudTrail\u003c/a>\u003cbr>\u003csmall>SAA-20-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-20-007-C002", "modulo": "20", "assunto": "Observabilidade, auditoria e operação", "campos": {"Pergunta": "\u003cp>Por que guardar logs de auditoria apenas na conta administrada pelo workload pode ser insuficiente?\u003c/p>", "Resposta": "\u003cp>O comprometimento dessa conta pode afetar a preservação da evidência.\u003c/p>", "Comentarios": "\u003cp>Separação de funções e controles de retenção ajudam a proteger a auditoria.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Observabilidade, auditoria e operação", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html\" target=\"_blank\" rel=\"noopener noreferrer\">Creating a trail for an organization - AWS CloudTrail\u003c/a>\u003cbr>\u003csmall>SAA-20-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-20-008-C001", "modulo": "20", "assunto": "Observabilidade, auditoria e operação", "campos": {"Pergunta": "\u003cp>Qual serviço mantém histórico de configurações e avalia regras de conformidade de recursos?\u003c/p>", "Resposta": "\u003cp>AWS Config.\u003c/p>", "Comentarios": "\u003cp>Ele complementa a auditoria de APIs e a observação de métricas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Observabilidade, auditoria e operação", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html\" target=\"_blank\" r ilidade pode evitar custo desnecessário?\u003c/p>", "Resposta": "\u003cp>Verificar se ele pode ser retirado de uso.\u003c/p>", "Comentarios": "\u003cp>Migrar tudo indiscriminadamente preserva desperdícios existentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Migração e transferência de dados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html\" target=\"_blank\" rel=\"noopener noreferrer\">About the migration strategies - AWS Prescriptive Guidance\u003c/a>\u003cbr>\u003csmall>SAA-21-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-21-001-C002", "modulo": "21", "assunto": "Migração e transferência de dados", "campos": {"Pergunta": "\u003cp>Qual diferença entre rehost e refactor em uma migração?\u003c/p>", "Resposta": "\u003cp>Rehost move com poucas mudanças; refactor altera a arquitetura de forma mais profunda.\u003c/p>", "Comentarios": "\u003cp>Prazo, risco e benefícios esperados orientam a escolha.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Migração e transferência de dados", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html\" target=\"_blank\" rel=\"noopener noreferrer\">About the migration strategies - AWS Prescriptive Guidance\u003c/a>\u003cbr>\u003csmall>SAA-21-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-21-002-C001", "modulo": "21", "assunto": "Migração e transferência de dados", "campos": {"Pergunta": "\u003cp>Qual serviço AWS ajuda a migrar servidores para AWS por replicação e lançamento de destino?\u003c/p>", "Resposta": "\u003cp>AWS Application Migration Service.\u003c/p>", "Comentarios": "\u003cp>É distinto de uma ferramenta especializada em replicar tabelas de banco.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Migração e transferência de dados", "Fonte": "\u003ca href=\"https://do : "SAA-24-011-C002", "modulo": "24", "assunto": "Conectividade híbrida e redes avançadas", "campos": {"Pergunta": "\u003cp>Ao integrar redes sobrepostas, qual deve ser a análise arquitetural?\u003c/p>", "Resposta": "\u003cp>Avaliar renumeração ou alternativas compatíveis com o acesso necessário, como exposição de serviço.\u003c/p>", "Comentarios": "\u003cp>Não assumir que trocar peering por outra conexão resolve todo conflito automaticamente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Conectividade híbrida e redes avançadas", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/vpc/latest/peering/invalid-peering-configurations.html\" target=\"_blank\" rel=\"noopener noreferrer\">How VPC peering connections work - Amazon Virtual Private Cloud\u003c/a>\u003cbr>\u003csmall>SAA-24-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-24-012-C001", "modulo": "24", "assunto": "Conectividade híbrida e redes avançadas", "campos": {"Pergunta": "\u003cp>Qual balanceador pode distribuir tráfego por appliances de inspeção virtual?\u003c/p>", "Resposta": "\u003cp>Gateway Load Balancer.\u003c/p>", "Comentarios": "\u003cp>As rotas devem direcionar tráfego aos componentes de inspeção adequados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Conectividade híbrida e redes avançadas", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is a Gateway Load Balancer? - Elastic Load Balancing\u003c/a>\u003cbr>\u003csmall>SAA-24-012-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-24-012-C002", "modulo": "24", "assunto": "Conectividade híbrida e redes avançadas", "campos": {"Pergunta": "\u003cp>Por que inspeção stateful pode exigir atenção ao caminho de ida e volta?\u003c/p>", "Resposta": "\u003cp>O estado da conexão precisa ser visto de forma consistente pelo mecanismo de inspeção.\u003c/p>", "Comentario vpc-network-infrastructure/using-nat-gateway-for-centralized-egress.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using the NAT gateway for centralized IPv4 egress - Building a Scalable and Secure Multi-VPC AWS Network Infrastructure\u003c/a>\u003cbr>\u003csmall>SAA-24-013-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-24-014-C001", "modulo": "24", "assunto": "Conectividade híbrida e redes avançadas", "campos": {"Pergunta": "\u003cp>O que representa MTU?\u003c/p>", "Resposta": "\u003cp>O tamanho máximo de unidade de transmissão suportada no enlace ou caminho considerado.\u003c/p>", "Comentarios": "\u003cp>Diferenças no caminho podem exigir fragmentação ou descoberta de MTU.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Conectividade híbrida e redes avançadas", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/network_mtu.html\" target=\"_blank\" rel=\"noopener noreferrer\">Network maximum transmission unit (MTU) for your EC2 instance - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-24-014-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-24-014-C002", "modulo": "24", "assunto": "Conectividade híbrida e redes avançadas", "campos": {"Pergunta": "\u003cp>Ter uma instância com rede rápida garante a mesma largura de banda até qualquer destino?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O menor limite entre os componentes do caminho pode ser o gargalo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Conectividade híbrida e redes avançadas", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/network_mtu.html\" target=\"_blank\" rel=\"noopener noreferrer\">Network maximum transmission unit (MTU) for your EC2 instance - Amazon Elastic Compute Cloud\u003c/a>\u003cbr>\u003csmall>SAA-24-014-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-24-015-C001", "modulo": "24", "assunto": "Conectividade híbrida e redes avançadas", "campos": {"Pergunta": "\u003cp>Como uma VPN pode participar de uma estratégia de contingência para Direct Connect?\u003c/p>", "Resposta": "\u003cp>Como caminho alternativo, com roteamento e capacidade planejados.\u003c/p>", "Comentarios": "\u003cp>É preciso validar failover, throughput e requisitos de segurança.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Conectividade híbrida e redes avançadas", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/toolkit-classic.html\" target=\"_blank\" rel=\"noopener noreferrer\">Configure a Direct Connect Classic connection - AWS Direct Connect\u003c/a>\u003cbr>\u003csmall>SAA-24-015-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-24-015-C002", "modulo": "24", "assunto": "Conectividade híbrida e redes avançadas", "campos": {"Pergunta": "\u003cp>Por que testar a rota de backup antes de uma falha real?\u003c/p>", "Resposta": "\u003cp>Para verificar que configuração e capacidade atendem aos objetivos de recuperação.\u003c/p>", "Comentarios": "\u003cp>A existência de uma conexão não prova que o tráfego será recuperado corretamente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Conectividade híbrida e redes avançadas", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/toolkit-classic.html\" target=\"_blank\" rel=\"noopener noreferrer\">Configure a Direct Connect Classic connection - AWS Direct Connect\u003c/a>\u003cbr>\u003csmall>SAA-24-015-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-001-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>TLS protege principalmente dados em repouso ou em trânsito?\u003c/p>", "Resposta": "\u003cp>Em trânsito.\u003c/p>", "Comentarios": "\u003cp>A criptografia do disco não protege, por si só, a comunicação de rede.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/data-protection.html\" target=\"_blank\" rel=\"noopener noreferrer\">Data protection - Security Pillar\u003c/a>\u003cbr>\u003csmall>SAA-25-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-001-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Criptografar um banco elimina a necessidade de controlar quem consulta seus dados?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Um principal autorizado pode receber dados descriptografados normalmente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/data-protection.html\" target=\"_blank\" rel=\"noopener noreferrer\">Data protection - Security Pillar\u003c/a>\u003cbr>\u003csmall>SAA-25-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-002-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Qual a diferença básica entre criptografia simétrica e assimétrica?\u003c/p>", "Resposta": "\u003cp>A simétrica usa uma chave compartilhada; a assimétrica usa um par pública/privada.\u003c/p>", "Comentarios": "\u003cp>A escolha depende do uso, como criptografia ou assinatura.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/symmetric-asymmetric.html\" target=\"_blank\" rel=\"noopener noreferrer\">Asymmetric keys in AWS KMS - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-002-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Em uma assinatura assimétrica, qual chave deve permanecer protegida?\u003c/p>", "Resposta": "\u003cp>A chave privada.\u003c/p>", "Comentarios": "\u003cp>A chave pública pode ser distribuída para verificação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/symmetric-asymmetric.html\" target=\"_blank\" rel=\"noopener noreferrer\">Asymmetric keys in AWS KMS - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-003-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Na envelope encryption, o que normalmente cifra o grande volume de dados?\u003c/p>", "Resposta": "\u003cp>Uma data key.\u003c/p>", "Comentarios": "\u003cp>A chave KMS protege a data key, evitando enviar todo o dado ao KMS.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#enveloping\" target=\"_blank\" rel=\"noopener noreferrer\">AWS KMS keys - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-003-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>O que deve ser armazenado junto dos dados para permitir recuperação em envelope encryption?\u003c/p>", "Resposta": "\u003cp>A data key cifrada e os metadados necessários.\u003c/p>", "Comentarios": "\u003cp>A data key em texto claro deve ser protegida e descartada após o uso apropriado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#enveloping\" target=\"_blank\" rel=\"noopener noreferrer\">AWS KMS keys - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-004-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Qual tipo de chave KMS oferece ao cliente controle sobre política e ciclo de vida?\u003c/p>", "Resposta": "\u003cp>Customer managed key.\u003c/p>", "Comentarios": "\u003cp>AWS managed e AWS owned keys têm modelos diferentes de controle.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS KMS keys - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-004-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>AWS owned key é uma chave que o cliente gerencia na própria conta?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Ela é controlada pela AWS para proteger dados em serviços que a utilizam.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS KMS keys - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-005-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Uma política IAM isolada sempre basta para usar uma chave KMS?\u003c/p>", "Resposta": "\u003cp>Não. A key policy e os demais controles aplicáveis precisam permitir o acesso.\u003c/p>", "Comentarios": "\u003cp>KMS possui um modelo de autorização centrado também na política da chave.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html\" target=\"_blank\" rel=\"noopener noreferrer\">Key policies in AWS KMS - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-005-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Qual política controla diretamente o acesso a uma chave KMS?\u003c/p>", "Resposta": "\u003cp>A key policy.\u003c/p>", "Comentarios": "\u003cp>Ela pode permitir delegação a políticas IAM conforme a configuração.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html\" target=\"_blank\" rel=\"noopener noreferrer\">Key policies in AWS KMS - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-006-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>O que é um grant no KMS?\u003c/p>", "Resposta": "\u003cp>Um mecanismo de concessão de operações específicas sobre uma chave.\u003c/p>", "Comentarios": "\u003cp>Serviços integrados podem usá-lo para acessar a chave em nome de workloads autorizados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/grants.html\" target=\"_blank\" rel=\"noopener noreferrer\">Grants in AWS KMS - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-006-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-006-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Um grant é uma cópia do material criptográfico da chave?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>É um instrumento de autorização, não uma exportação de chave.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/grants.html\" target=\"_blank\" rel=\"noopener noreferrer\">Grants in AWS KMS - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-006-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-007-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Para acesso KMS entre contas, basta a política IAM da conta consumidora?\u003c/p>", "Resposta": "\u003cp>Não. A política da chave na conta proprietária também precisa permitir o acesso.\u003c/p>", "Comentarios": "\u003cp>As operações suportadas entre contas devem ser verificadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Allowing users in other accounts to use a KMS key - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-007-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-007-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Por que compartilhar um snapshot criptografado pode exigir compartilhar autorização da chave?\u003c/p>", "Resposta": "\u003cp>Porque acessar o snapshot não elimina a necessidade de descriptografar seus dados.\u003c/p>", "Comentarios": "\u003cp>Permissões de recurso e criptografia são camadas distintas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html\" target=\"_blank\" rel=\"noopener noreferrer\">Allowing users in other accounts to use a KMS key - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-007-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-008-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Rotacionar uma chave KMS recriptografa automaticamente todos os dados existentes?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O serviço preserva material anterior para operações compatíveis; recriptografar dados é uma ação distinta.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html\" target=\"_blank\" rel=\"noopener noreferrer\">Rotate AWS KMS keys - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-008-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-008-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Por que excluir uma chave KMS exige cuidado especial?\u003c/p>", "Resposta": "\u003cp>Dados que dependem dela podem ficar irrecuperáveis.\u003c/p>", "Comentarios": "\u003cp>A existência de backups cifrados pela mesma chave não elimina essa dependência.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html\" target=\"_blank\" rel=\"noopener noreferrer\">Delete an AWS KMS key - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-008-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-008-C003", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Desativar uma chave KMS tem o mesmo caráter irreversível de sua exclusão concluída?\u003c/p>", "Resposta": "\u003cp>Não. A desativação pode ser revertida.\u003c/p>", "Comentarios": "\u003cp>Mesmo reversível, pode interromper serviços que precisam da chave.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html\" target=\"_blank\" rel=\"noopener noreferrer\">Delete an AWS KMS key - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-008-C003 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-009-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Qual é a vantagem de chaves KMS Multi-Region relacionadas?\u003c/p>", "Resposta": "\u003cp>Permitir uso de material criptográfico relacionado em regiões diferentes.\u003c/p>", "Comentarios": "\u003cp>Isso pode apoiar aplicações que movem dados cifrados entre regiões.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-Region keys in AWS KMS - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-009-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-009-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>As políticas de chaves Multi-Region são sincronizadas automaticamente entre todas as réplicas?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Vários atributos e controles são administrados independentemente em cada região.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-Region keys in AWS KMS - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-009-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-010-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>O que é encryption context no KMS?\u003c/p>", "Resposta": "\u003cp>Um conjunto de pares chave-valor usado como dado autenticado adicional em operações compatíveis.\u003c/p>", "Comentarios": "\u003cp>Pode ajudar a vincular a operação a um contexto esperado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/encrypt_context.html\" target=\"_blank\" rel=\"noopener noreferrer\">Encryption context - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-010-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-010-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>É adequado colocar um segredo no encryption context?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O contexto não é tratado como informação secreta e pode aparecer em logs.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/kms/latest/developerguide/encrypt_context.html\" target=\"_blank\" rel=\"noopener noreferrer\">Encryption context - AWS Key Management Service\u003c/a>\u003cbr>\u003csmall>SAA-25-010-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-011-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Qual serviço oferece HSMs dedicados com controle criptográfico mais direto pelo cliente?\u003c/p>", "Resposta": "\u003cp>AWS CloudHSM.\u003c/p>", "Comentarios": "\u003cp>Esse controle vem com responsabilidades operacionais maiores que integrações comuns com KMS.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS CloudHSM? - AWS CloudHSM\u003c/a>\u003cbr>\u003csmall>SAA-25-011-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-011-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Exigir uso de um HSM significa necessariamente administrar um cluster CloudHSM?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>É preciso distinguir exigência técnica do módulo de segurança da exigência de controle dedicado pelo cliente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS CloudHSM? - AWS CloudHSM\u003c/a>\u003cbr>\u003csmall>SAA-25-011-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-012-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Qual serviço é voltado ao ciclo de vida de segredos como credenciais de banco, incluindo rotação?\u003c/p>", "Resposta": "\u003cp>AWS Secrets Manager.\u003c/p>", "Comentarios": "\u003cp>Escolher o mecanismo de rotação apropriado ao tipo de segredo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html\" target=\"_blank\" rel=\"noopener noreferrer\">What is AWS Secrets Manager? - AWS Secrets Manager\u003c/a>\u003cbr>\u003csmall>SAA-25-012-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-012-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Qual recurso pode armazenar parâmetros de configuração e valores SecureString?\u003c/p>", "Resposta": "\u003cp>Systems Manager Parameter Store.\u003c/p>", "Comentarios": "\u003cp>Armazenar valor cifrado não equivale automaticamente a rotacionar a credencial no sistema de destino.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Systems Manager Parameter Store - AWS Systems Manager\u003c/a>\u003cbr>\u003csmall>SAA-25-012-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-013-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Por que mudar apenas o valor guardado no Secrets Manager pode quebrar a aplicação?\u003c/p>", "Resposta": "\u003cp>A credencial no banco ou serviço de destino pode continuar diferente.\u003c/p>", "Comentarios": "\u003cp>Uma rotação precisa coordenar o segredo e o sistema que o valida.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html\" target=\"_blank\" rel=\"noopener noreferrer\">Rotate AWS Secrets Manager secrets - AWS Secrets Manager\u003c/a>\u003cbr>\u003csmall>SAA-25-013-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-013-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Qual cuidado uma aplicação com cache de segredos precisa ter após rotação?\u003c/p>", "Resposta": "\u003cp>Atualizar ou invalidar o valor armazenado conforme o fluxo de rotação.\u003c/p>", "Comentarios": "\u003cp>Usar indefinidamente a credencial antiga pode causar falhas de autenticação.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html\" target=\"_blank\" rel=\"noopener noreferrer\">Rotate AWS Secrets Manager secrets - AWS Secrets Manager\u003c/a>\u003cbr>\u003csmall>SAA-25-013-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-014-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Certificados importados no ACM recebem renovação automática do ACM?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O cliente precisa providenciar renovação e reimportação apropriadas.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html\" target=\"_blank\" rel=\"noopener noreferrer\">Managed certificate renewal in AWS Certificate Manager - AWS Certificate Manager\u003c/a>\u003cbr>\u003csmall>SAA-25-014-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-014-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Todos os certificados emitidos pelo ACM são renovados sem condições adicionais?\u003c/p>", "Resposta": "\u003cp>Não. É preciso cumprir os requisitos de elegibilidade e validação.\u003c/p>", "Comentarios": "\u003cp>Não presumir que remover registros necessários à validação seja inofensivo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html\" target=\"_blank\" rel=\"noopener noreferrer\">Managed certificate renewal in AWS Certificate Manager - AWS Certificate Manager\u003c/a>\u003cbr>\u003csmall>SAA-25-014-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-015-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>HTTPS no ALB garante que o trecho ALB até os targets também usa TLS?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>O protocolo do target group determina a comunicação com os targets.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html\" target=\"_blank\" rel=\"noopener noreferrer\">Create an HTTPS listener for your Application Load Balancer - Elastic Load Balancing\u003c/a>\u003cbr>\u003csmall>SAA-25-015-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-015-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>O que configurar quando o requisito exige cifrar também o tráfego do balanceador ao backend?\u003c/p>", "Resposta": "\u003cp>Uma conexão TLS compatível no trecho até os targets.\u003c/p>", "Comentarios": "\u003cp>Criptografia em um segmento não se estende automaticamente aos demais.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html\" target=\"_blank\" rel=\"noopener noreferrer\">Create an HTTPS listener for your Application Load Balancer - Elastic Load Balancing\u003c/a>\u003cbr>\u003csmall>SAA-25-015-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-016-C001", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>Uma aplicação tem GetObject, mas falha ao ler um objeto SSE-KMS. Qual autorização adicional investigar?\u003c/p>", "Resposta": "\u003cp>A autorização para usar a chave KMS, incluindo kms:Decrypt quando exigido.\u003c/p>", "Comentarios": "\u003cp>Conferir IAM, key policy e estado da chave.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using server-side encryption with AWS KMS keys (SSE-KMS) - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-25-016-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-25-016-C002", "modulo": "25", "assunto": "KMS, certificados e segredos", "campos": {"Pergunta": "\u003cp>O que acontece com acessos que precisam de uma chave KMS desativada?\u003c/p>", "Resposta": "\u003cp>Eles podem falhar mesmo que a policy do recurso permita a operação.\u003c/p>", "Comentarios": "\u003cp>Disponibilidade da chave faz parte da disponibilidade do dado.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "KMS, certificados e segredos", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html\" target=\"_blank\" rel=\"noopener noreferrer\">Using server-side encryption with AWS KMS keys (SSE-KMS) - Amazon Simple Storage Service\u003c/a>\u003cbr>\u003csmall>SAA-25-016-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-001-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Qual pilar orienta identidade forte, proteção de dados e preparação para eventos de segurança?\u003c/p>", "Resposta": "\u003cp>Segurança.\u003c/p>", "Comentarios": "\u003cp>Aplicar controles em camadas e observar o contexto do workload.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Security Pillar - AWS Well-Architected Framework - Security Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-001-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-001-C002", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Defesa em profundidade significa repetir o mesmo controle em todos os lugares?\u003c/p>", "Resposta": "\u003cp>Não. Significa combinar camadas complementares.\u003c/p>", "Comentarios": "\u003cp>Rede, identidade, aplicação e dados têm riscos diferentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Security Pillar - AWS Well-Architected Framework - Security Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-001-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-002-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Qual pilar trata de operação correta, recuperação e adaptação a mudanças de demanda?\u003c/p>", "Resposta": "\u003cp>Confiabilidade.\u003c/p>", "Comentarios": "\u003cp>Falhas devem ser consideradas no desenho, não apenas após incidentes.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Reliability Pillar - AWS Well-Architected Framework - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-002-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-002-C002", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Por que remover um ponto único de falha pode exigir revisar dependências indiretas?\u003c/p>", "Resposta": "\u003cp>A redundância visível pode depender do mesmo componente compartilhado.\u003c/p>", "Comentarios": "\u003cp>Analisar o sistema completo.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Reliability Pillar - AWS Well-Architected Framework - Reliability Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-002-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-003-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Qual pilar orienta selecionar e utilizar recursos eficientemente para cumprir desempenho?\u003c/p>", "Resposta": "\u003cp>Eficiência de performance.\u003c/p>", "Comentarios": "\u003cp>Escolhas devem evoluir conforme métricas, tecnologias e demanda.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Performance Efficiency Pillar - AWS Well-Architected Framework - Performance Efficiency Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-003-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-003-C002", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>O recurso mais potente é sempre a escolha mais eficiente?\u003c/p>", "Resposta": "\u003cp>Não.\u003c/p>", "Comentarios": "\u003cp>Pode haver outra arquitetura que entregue o requisito com melhor uso de recursos.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Performance Efficiency Pillar - AWS Well-Architected Framework - Performance Efficiency Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-003-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-004-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Otimização de custos busca somente reduzir a fatura absoluta?\u003c/p>", "Resposta": "\u003cp>Não. Busca atender objetivos de negócio com gasto eficiente.\u003c/p>", "Comentarios": "\u003cp>Uma redução que destrói o serviço não é uma otimização válida.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Cost Optimization Pillar - AWS Well-Architected Framework - Cost Optimization Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-004-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-004-C002", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Por que medir custo por unidade de trabalho pode ser útil?\u003c/p>", "Resposta": "\u003cp>Relaciona gasto ao valor ou volume produzido.\u003c/p>", "Comentarios": "\u003cp>A conta total pode crescer enquanto a eficiência por transação melhora.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Cost Optimization Pillar - AWS Well-Architected Framework - Cost Optimization Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-004-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-005-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Qual pilar enfatiza execução de operações, aprendizado e melhoria contínua?\u003c/p>", "Resposta": "\u003cp>Excelência operacional.\u003c/p>", "Comentarios": "\u003cp>Procedimentos, métricas e automação ajudam a operar de forma consistente.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Operational Excellence Pillar - AWS Well-Architected Framework - Operational Excellence Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-005-C001 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-005-C002", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Por que mudanças pequenas e reversíveis ajudam operações?\u003c/p>", "Resposta": "\u003cp>Reduzem o impacto e facilitam diagnóstico e retorno.\u003c/p>", "Comentarios": "\u003cp>Reversibilidade precisa ser planejada também para alterações de dados.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">Operational Excellence Pillar - AWS Well-Architected Framework - Operational Excellence Pillar\u003c/a>\u003cbr>\u003csmall>SAA-26-005-C002 · Referência consultada em 05/10/2026\u003c/small>"}}, {"id": "SAA-26-006-C001", "modulo": "26", "assunto": "Well-Architected e decisões transversais", "campos": {"Pergunta": "\u003cp>Qual pilar trata de reduzir impacto ambiental dos workloads?\u003c/p>", "Resposta": "\u003cp>Sustentabilidade.\u003c/p>", "Comentarios": "\u003cp>Melhor utilização e eliminação de trabalho desnecessário podem contribuir.\u003c/p>", "Logo": "", "Materia": "AWS · SAA-C03", "Assunto": "Well-Architected e decisões transversais", "Fonte": "\u003ca href=\"https://docs.aws.amazon.com/wellarchitected/latest/sustainability-pillar/sustainability-pillar.html\" target=\"_blank\" rel=\"noopener noreferrer\">Sustainability Pillar - AWS Well-Architected Fr
